<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>EZVIZ DL06 Video</title>
<style>
  html,body{margin:0;background:#fff}
  canvas{display:block;width:540px;height:960px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =====================================================================
   CẤU HÌNH NỘI DUNG — sửa chữ ở đây rồi chạy lại: node render.js
   ===================================================================== */
const CONFIG = {
  model: 'EZVIZ DL06',
  subtitle: 'Khoá cửa thông minh vân tay',
  chips: ['Wi-Fi', 'Bluetooth', 'App EZVIZ'],
  slots: [
    { label: 'ẢNH LẮP ĐẶT THỰC TẾ 1', caption: 'Sang trọng trên mọi cánh cửa' },
    { label: 'ẢNH LẮP ĐẶT THỰC TẾ 2', caption: 'Lắp đặt gọn gàng, thẩm mỹ' },
    { label: 'ẢNH LẮP ĐẶT THỰC TẾ 3', caption: 'Công trình thực tế' },
  ],
  methods: [
    { icon: 'finger', hl: 'finger', title: 'Vân tay',      desc: 'Một chạm là mở, nhanh trong tích tắc' },
    { icon: 'keypad', hl: 'keypad', title: 'Mật khẩu',     desc: 'Mã ảo chống nhìn trộm' },
    { icon: 'card',   hl: 'card',   title: 'Thẻ từ',       desc: 'Chạm thẻ là mở, tiện cho cả nhà' },
    { icon: 'phone',  hl: 'app',    title: 'App EZVIZ',    desc: 'Mở bằng Bluetooth hoặc từ xa qua Wi-Fi' },
    { icon: 'clock',  hl: 'keypad', title: 'Mã tạm thời',  desc: 'Gửi mã cho khách, người giúp việc' },
    { icon: 'key',    hl: 'key',    title: 'Chìa cơ',      desc: 'Dự phòng khi cần thiết' },
  ],
  features: [
    { icon: 'shield',  title: 'Cảnh báo cạy phá', desc: 'Báo động khi bị tác động' },
    { icon: 'notify',  title: 'Thông báo tức thì', desc: 'Biết ngay khi cửa mở' },
    { icon: 'drop',    title: 'Chuẩn IP55',        desc: 'Mặt ngoài chống nước' },
    { icon: 'users',   title: '50 người dùng',     desc: 'Lưu đến 50 vân tay' },
    { icon: 'bell',    title: 'Chuông cửa',        desc: 'Tích hợp sẵn trên khoá' },
    { icon: 'battery', title: 'Cảnh báo pin yếu',  desc: 'Không lo hết pin bất ngờ' },
  ],
  tagline: 'Mở cửa thông minh – Sống an tâm',
  cta: 'Liên hệ tư vấn & lắp đặt',
  contact: '',   // VD: 'Hotline: 0909 xxx xxx' — để trống sẽ hiện ô trống để tự chèn
};

/* Ảnh do render.js nạp vào (anh/slot1.jpg, anh/slot2.jpg, anh/slot3.jpg, anh/logo.png) */
window.ASSETS = window.ASSETS || {};
const IMG = {};
window.loadAssets = async (assets) => {
  const jobs = Object.entries(assets).map(([k, src]) => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = res; im.src = src;
  }));
  await Promise.all(jobs);
};

/* ===================== Bảng màu ===================== */
const C = {
  bg1: '#FFFFFF', bg2: '#E6F3FD', blue: '#2C9AF0', blueD: '#1677D2', blueL: '#BFE2FB',
  blueXL: '#EAF5FE', ink: '#0F2A44', ink2: '#4A6782', white: '#FFFFFF', ok: '#22B07D',
};
const FONT = 'Inter';

/* ===================== Timeline (giây) ===================== */
const FPS = 30;
const SCENES = [
  { id: 'intro',    start: 0.0,  dur: 4.0 },
  { id: 'slot0',    start: 4.0,  dur: 3.5 },
  { id: 'mintro',   start: 7.5,  dur: 1.6 },
  { id: 'methods',  start: 9.1,  dur: 12.0 },   // 6 x 2.0s
  { id: 'slot1',    start: 21.1, dur: 3.5 },
  { id: 'features', start: 24.6, dur: 6.8 },
  { id: 'slot2',    start: 31.4, dur: 3.5 },
  { id: 'outro',    start: 34.9, dur: 4.1 },
];
const DURATION = 39.0;
window.VIDEO_META = { FPS, DURATION, SCENES, methodStart: 9.1, methodDur: 2.0 };

/* ===================== Tiện ích ===================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 700} ${o.size || 40}px ${FONT}`;
  ctx.fillStyle = o.color || C.ink;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.spacing) ctx.letterSpacing = o.spacing + 'px';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function wrap(str, maxW, size, weight) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`;
  const words = str.split(' '); const lines = []; let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  ctx.restore(); return lines;
}
function shadowCard(x, y, w, h, r, fill = C.white, blur = 40, alpha = .12) {
  ctx.save();
  ctx.shadowColor = `rgba(22,119,210,${alpha})`; ctx.shadowBlur = blur; ctx.shadowOffsetY = blur / 3;
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
}

/* ===================== Nền ===================== */
const BOKEH = Array.from({ length: 14 }, (_, i) => ({
  x: (i * 337) % W, y: (i * 613) % H, r: 60 + (i * 47) % 160, sp: .3 + (i % 5) * .12, ph: i * 1.7,
}));
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg1); g.addColorStop(.55, '#F3F9FE'); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // vệt sáng chéo
  ctx.save();
  ctx.globalAlpha = .5;
  const g2 = ctx.createLinearGradient(0, 0, W, H);
  g2.addColorStop(0, 'rgba(191,226,251,0)'); g2.addColorStop(.5, 'rgba(191,226,251,.45)'); g2.addColorStop(1, 'rgba(191,226,251,0)');
  ctx.fillStyle = g2;
  ctx.translate(W / 2, H / 2); ctx.rotate(-0.5);
  ctx.fillRect(-1400, -160 + Math.sin(t * .4) * 120, 2800, 320);
  ctx.restore();
  // bokeh
  for (const b of BOKEH) {
    const x = b.x + Math.sin(t * b.sp + b.ph) * 40;
    const y = (b.y - t * 18 * b.sp + H * 2) % (H + 300) - 150;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    rg.addColorStop(0, 'rgba(44,154,240,.10)'); rg.addColorStop(1, 'rgba(44,154,240,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, b.r, 0, Math.PI * 2); ctx.fill();
  }
  // lưới chấm mờ
  ctx.save(); ctx.fillStyle = 'rgba(44,154,240,.07)';
  for (let yy = 40; yy < H; yy += 60) for (let xx = 30; xx < W; xx += 60) { ctx.beginPath(); ctx.arc(xx, yy, 2, 0, 6.3); ctx.fill(); }
  ctx.restore();
}

/* ===================== Logo góc màn hình ===================== */
function logo(t) {
  const a = eOut(prog(t, 0.2, 0.9));
  ctx.save(); ctx.globalAlpha = a;
  const x = 56, y = 56;
  if (IMG.logo) {
    const h = 62, w = IMG.logo.width / IMG.logo.height * h;
    shadowCard(x - 4, y - 4, w + 56, h + 40, 32, 'rgba(255,255,255,.95)', 24, .10);
    ctx.drawImage(IMG.logo, x + 24, y + 16, w, h);
  } else {
    // Wordmark EZVIZ dạng chữ (thay bằng anh/logo.png để dùng logo gốc)
    shadowCard(x, y, 260, 92, 46, 'rgba(255,255,255,.92)', 24, .10);
    text('EZVIZ', x + 130, y + 48, { size: 50, weight: 900, color: C.ink, spacing: 3 });
  }
  ctx.restore();
}

/* ===================== Khoá DL06 — ẢNH THẬT (anh/dl06_front.png) ===================== */
// Toạ độ điểm nóng tính theo tỉ lệ ảnh dl06_front.png (326x775)
const HOT = {
  panelCx: .85,
  finger: { x: .742, y: .529, r: .026 },
  glass:  { x0: .724, x1: .975, y0: .013, y1: .445 },
  card:   { x: .85, y: .239 },
  bell:   { x: .844, y: .09 },
};
function lockGeom(cx, cy, s) {
  const im = IMG.front; const h = 880 * s; const w = im ? im.width / im.height * h : h * .42;
  const x0 = cx - HOT.panelCx * w, y0 = cy - h / 2;
  return { x0, y0, w, h, P: (fx, fy) => [x0 + fx * w, y0 + fy * h] };
}
function drawLock(cx, cy, s, o = {}) {
  const hl = o.hl, pulse = o.pulse || 0, unlocked = o.unlocked || 0;
  const g = lockGeom(cx, cy, s); const im = IMG.front;
  if (!im) return;
  // bóng đổ mềm dưới khoá
  ctx.save();
  ctx.shadowColor = 'rgba(15,42,68,.30)'; ctx.shadowBlur = 50 * s; ctx.shadowOffsetX = 18 * s; ctx.shadowOffsetY = 30 * s;
  ctx.drawImage(im, g.x0, g.y0, g.w, g.h);
  ctx.restore();
  // mặt kính sáng lên khi dùng bàn phím / thẻ
  if (hl === 'keypad' || hl === 'card') {
    const [gx0, gy0] = g.P(HOT.glass.x0, HOT.glass.y0), [gx1, gy1] = g.P(HOT.glass.x1, HOT.glass.y1);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    rr(gx0 + 4 * s, gy0 + 4 * s, gx1 - gx0 - 8 * s, gy1 - gy0 - 8 * s, 18 * s);
    const lg = ctx.createLinearGradient(0, gy0, 0, gy1);
    lg.addColorStop(0, `rgba(40,120,200,${.10 + .10 * pulse})`); lg.addColorStop(1, `rgba(40,120,200,${.04 + .06 * pulse})`);
    ctx.fillStyle = lg; ctx.fill(); ctx.restore();
    ctx.save(); ctx.shadowColor = '#5BB9FF'; ctx.shadowBlur = 30 * s * (1 + pulse);
    rr(gx0, gy0, gx1 - gx0, gy1 - gy0, 20 * s); ctx.strokeStyle = `rgba(91,185,255,${.6 + .4 * pulse})`; ctx.lineWidth = 4 * s; ctx.stroke(); ctx.restore();
  }
  if (hl === 'card') {
    const [x, y] = g.P(HOT.card.x, HOT.card.y);
    ctx.save(); ctx.strokeStyle = '#8FD3FF'; ctx.lineWidth = 3 * s;
    for (let i = 1; i <= 3; i++) { ctx.globalAlpha = (1 - i / 4) * (.5 + .5 * pulse); ctx.beginPath(); ctx.arc(x, y, (14 + i * 14) * s, 0, 6.3); ctx.stroke(); }
    ctx.restore();
  }
  // vòng sáng tại cảm biến vân tay
  const [fx, fy] = g.P(HOT.finger.x, HOT.finger.y); const fr = HOT.finger.r * g.h;
  if (hl === 'finger' || (unlocked > 0 && o.okAt === 'finger')) {
    const col = unlocked > 0 ? '34,176,125' : '91,185,255';
    ctx.save(); ctx.shadowColor = `rgb(${col})`; ctx.shadowBlur = 24 * s * (1 + pulse);
    ctx.strokeStyle = `rgba(${col},${.75 + .25 * pulse})`; ctx.lineWidth = 5 * s;
    ctx.beginPath(); ctx.arc(fx, fy, fr * 1.25, 0, 6.3); ctx.stroke();
    for (let i = 1; i <= 2; i++) { ctx.globalAlpha = .5 * (1 - i / 3) * (.4 + .6 * pulse); ctx.beginPath(); ctx.arc(fx, fy, fr * (1.25 + i * .55), 0, 6.3); ctx.stroke(); }
    ctx.restore();
  }
  // đèn xanh lá khi mở khoá (viền mặt kính)
  if (unlocked > 0 && o.okAt !== 'finger') {
    const [gx0, gy0] = g.P(HOT.glass.x0, HOT.glass.y0), [gx1, gy1] = g.P(HOT.glass.x1, HOT.glass.y1);
    ctx.save(); ctx.globalAlpha = unlocked; ctx.shadowColor = '#22B07D'; ctx.shadowBlur = 30 * s;
    rr(gx0, gy0, gx1 - gx0, gy1 - gy0, 20 * s); ctx.strokeStyle = '#3DD39A'; ctx.lineWidth = 5 * s; ctx.stroke(); ctx.restore();
  }
}
function drawBack(cx, cy, h, alpha = 1) {
  const im = IMG.back; if (!im) return; const w = im.width / im.height * h;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.shadowColor = 'rgba(15,42,68,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 24;
  ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h); ctx.restore();
}

/* ===================== Icon ===================== */
function icon(name, x, y, sz, col, t = 0) {
  ctx.save(); ctx.translate(x, y); const s = sz / 100; ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const P = Math.PI;
  switch (name) {
    case 'finger': {
      const arcs = [[10, 1.0, 2.0], [20, .95, 2.05], [30, .9, 2.1], [40, .85, 2.15], [50, .9, 2.0]];
      ctx.beginPath(); ctx.ellipse(0, 0, 4, 10, 0, 0, 6.3); ctx.stroke();
      arcs.forEach(([r, a, b], i) => { ctx.beginPath(); ctx.ellipse(0, 4, r * .8, r, 0, P * a, P * b + (i % 2 ? .2 : 0)); ctx.stroke(); });
      for (let i = 1; i <= 4; i++) { ctx.beginPath(); ctx.ellipse(0, 4, i * 10 * .8, i * 10, 0, P * .1, P * .6 - i * .05); ctx.stroke(); }
      // tia quét
      const sy = -55 + ((t * 1.6) % 1) * 110;
      ctx.save(); ctx.strokeStyle = '#5BB9FF'; ctx.lineWidth = 6; ctx.shadowColor = '#5BB9FF'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.moveTo(-55, sy); ctx.lineTo(55, sy); ctx.stroke(); ctx.restore();
      break;
    }
    case 'keypad': {
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        rr(-52 + c * 38, -52 + r * 38, 28, 28, 8); ctx.fill();
      }
      break;
    }
    case 'card': {
      rr(-55, -36, 110, 72, 12); ctx.stroke();
      rr(-40, -16, 22, 18, 4); ctx.fill();
      ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-40, 18); ctx.lineTo(10, 18); ctx.stroke();
      for (let i = 1; i <= 2; i++) { ctx.beginPath(); ctx.arc(20, -6, 10 * i, -P * .3, P * .3); ctx.stroke(); }
      break;
    }
    case 'phone': {
      rr(-32, -56, 64, 112, 14); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 40, 4, 0, 6.3); ctx.fill();
      // sóng
      for (let i = 1; i <= 3; i++) {
        const a = .4 + .6 * ((Math.sin(t * 6 - i) + 1) / 2);
        ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(40, -40, 12 * i, -P * .45, P * .05); ctx.stroke(); ctx.restore();
      }
      // ổ khoá nhỏ trên màn
      ctx.lineWidth = 5; rr(-14, -8, 28, 22, 4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -10, 8, P, 0); ctx.stroke();
      break;
    }
    case 'clock': {
      ctx.beginPath(); ctx.arc(0, 0, 50, 0, 6.3); ctx.stroke();
      ctx.save(); ctx.rotate(t * 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -36); ctx.stroke(); ctx.restore();
      ctx.save(); ctx.rotate(t * .5 + 1); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -22); ctx.stroke(); ctx.restore();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.3); ctx.fill();
      break;
    }
    case 'key': {
      ctx.save(); ctx.rotate(-P / 4);
      ctx.beginPath(); ctx.arc(-34, 0, 22, 0, 6.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(-34, 0, 7, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(56, 0); ctx.moveTo(40, 0); ctx.lineTo(40, 16); ctx.moveTo(52, 0); ctx.lineTo(52, 12); ctx.moveTo(26, 0); ctx.lineTo(26, 12); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'shield': {
      ctx.beginPath(); ctx.moveTo(0, -56); ctx.lineTo(46, -38); ctx.lineTo(46, 4); ctx.quadraticCurveTo(46, 40, 0, 58); ctx.quadraticCurveTo(-46, 40, -46, 4); ctx.lineTo(-46, -38); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, 10); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 28, 5, 0, 6.3); ctx.fill();
      break;
    }
    case 'notify': {
      rr(-30, -52, 60, 104, 12); ctx.stroke();
      ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-16, -10); ctx.lineTo(16, -10); ctx.moveTo(-16, 8); ctx.lineTo(8, 8); ctx.stroke();
      ctx.save(); ctx.fillStyle = '#FF6B6B'; ctx.beginPath(); ctx.arc(30, -50, 14, 0, 6.3); ctx.fill(); ctx.restore();
      break;
    }
    case 'drop': {
      ctx.beginPath(); ctx.moveTo(0, -58); ctx.bezierCurveTo(30, -20, 44, 0, 44, 18); ctx.arc(0, 18, 44, 0, P); ctx.bezierCurveTo(-44, 0, -30, -20, 0, -58); ctx.stroke();
      ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 18, 26, P * .55, P * .95); ctx.stroke();
      break;
    }
    case 'users': {
      ctx.beginPath(); ctx.arc(-16, -22, 20, 0, 6.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(-16, 48, 38, P * 1.15, P * 1.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(28, -14, 16, 0, 6.3); ctx.stroke();
      ctx.beginPath(); ctx.arc(30, 46, 30, P * 1.2, P * 1.8); ctx.stroke();
      break;
    }
    case 'bell': {
      ctx.save(); ctx.rotate(Math.sin(t * 10) * .12);
      ctx.beginPath(); ctx.moveTo(-40, 26); ctx.lineTo(-32, 14); ctx.lineTo(-32, -10); ctx.quadraticCurveTo(-32, -44, 0, -46); ctx.quadraticCurveTo(32, -44, 32, -10); ctx.lineTo(32, 14); ctx.lineTo(40, 26); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 36, 10, 0, P); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -46); ctx.lineTo(0, -56); ctx.stroke();
      ctx.restore();
      break;
    }
    case 'battery': {
      rr(-52, -28, 96, 56, 10); ctx.stroke(); rr(48, -12, 8, 24, 3); ctx.fill();
      ctx.save(); ctx.fillStyle = '#FF8A3D'; rr(-42, -18, 22 + 8 * Math.sin(t * 4) ** 2, 36, 5); ctx.fill(); ctx.restore();
      break;
    }
    case 'check': {
      ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(-30, 2); ctx.lineTo(-8, 24); ctx.lineTo(34, -22); ctx.stroke();
      break;
    }
    case 'image': {
      rr(-60, -46, 120, 92, 14); ctx.stroke();
      ctx.beginPath(); ctx.arc(28, -18, 10, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-48, 34); ctx.lineTo(-14, -6); ctx.lineTo(10, 18); ctx.lineTo(24, 6); ctx.lineTo(48, 34); ctx.stroke();
      break;
    }
  }
  ctx.restore();
}
function iconBubble(name, x, y, r, t, k = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.save(); ctx.shadowColor = 'rgba(44,154,240,.30)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
  const g = ctx.createLinearGradient(-r, -r, r, r); g.addColorStop(0, '#5BB9FF'); g.addColorStop(1, C.blueD);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  icon(name, 0, 0, r * 1.05, '#FFFFFF', t);
  ctx.restore();
}
function pill(str, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight || 700} ${o.size || 34}px ${FONT}`;
  const w = ctx.measureText(str).width + (o.padX || 44) * 2 + (o.icon ? 50 : 0), h = (o.size || 34) * 2;
  ctx.restore();
  ctx.save(); if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
  if (o.solid) {
    ctx.save(); ctx.shadowColor = 'rgba(22,119,210,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0); g.addColorStop(0, o.c1 || '#47AEFA'); g.addColorStop(1, o.c2 || C.blueD);
    rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  } else {
    shadowCard(x - w / 2, y - h / 2, w, h, h / 2, 'rgba(255,255,255,.95)', 20, .12);
    rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.strokeStyle = C.blueL; ctx.lineWidth = 2; ctx.stroke();
  }
  const tx = o.icon ? x + 25 : x;
  if (o.icon) icon(o.icon, x - w / 2 + (o.padX || 44) + 16, y, 38, o.solid ? '#fff' : C.blue);
  text(str, tx, y + 2, { size: o.size || 34, weight: o.weight || 700, color: o.solid ? '#fff' : C.ink });
  ctx.restore();
}

/* ===================== Khung ảnh lắp đặt ===================== */
function slotScene(t, dur, idx) {
  const slot = CONFIG.slots[idx];
  const img = IMG['slot' + (idx + 1)];
  const a = eOut(prog(t, 0, .5));
  const fx = 80, fy = 300, fw = 920, fh = 1180;
  ctx.save();
  ctx.globalAlpha *= a;
  ctx.translate(W / 2, fy + fh / 2); const sc = lerp(.92, 1, a); ctx.scale(sc, sc); ctx.translate(-W / 2, -(fy + fh / 2));
  // chip trên cùng
  pill('THỰC TẾ LẮP ĐẶT', W / 2, 220, { size: 28, weight: 800, solid: true });
  shadowCard(fx, fy, fw, fh, 48, '#FFFFFF', 50, .16);
  ctx.save(); rr(fx + 16, fy + 16, fw - 32, fh - 32, 36); ctx.clip();
  if (img) {
    const z = 1.04 + .08 * (t / dur);
    const ar = img.width / img.height, br = (fw - 32) / (fh - 32);
    let dw, dh; if (ar > br) { dh = fh - 32; dw = dh * ar; } else { dw = fw - 32; dh = dw / ar; }
    dw *= z; dh *= z;
    ctx.drawImage(img, W / 2 - dw / 2, fy + fh / 2 - dh / 2, dw, dh);
  } else {
    const g = ctx.createLinearGradient(0, fy, 0, fy + fh); g.addColorStop(0, '#F2F9FF'); g.addColorStop(1, '#DCEFFD');
    ctx.fillStyle = g; ctx.fillRect(fx, fy, fw, fh);
    // vệt shimmer
    const sx = -400 + ((t / dur) * 1.6) * (fw + 800);
    const sg = ctx.createLinearGradient(fx + sx - 200, 0, fx + sx + 200, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.6)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(fx, fy, fw, fh);
  }
  ctx.restore();
  if (!img) {
    ctx.save(); ctx.setLineDash([26, 18]); ctx.lineDashOffset = -t * 40; ctx.strokeStyle = C.blue; ctx.lineWidth = 5;
    rr(fx + 40, fy + 40, fw - 80, fh - 80, 30); ctx.stroke(); ctx.restore();
    icon('image', W / 2, fy + fh / 2 - 90, 150, C.blue);
    text(slot.label, W / 2, fy + fh / 2 + 50, { size: 46, weight: 800, color: C.blueD });
    text('Chèn ảnh / video của bạn vào khung này', W / 2, fy + fh / 2 + 115, { size: 32, weight: 500, color: C.ink2 });
    text(`Thời điểm: ${fmt(SCENES.find(s => s.id === 'slot' + idx).start)} – ${fmt(SCENES.find(s => s.id === 'slot' + idx).start + dur)}`, W / 2, fy + fh / 2 + 165, { size: 28, weight: 600, color: C.blue });
  }
  ctx.restore();
  // caption
  const ca = eOut(prog(t, .35, .9));
  ctx.save(); ctx.globalAlpha *= ca;
  text(slot.caption, W / 2, 1600 + (1 - ca) * 30, { size: 58, weight: 800, color: C.ink });
  ctx.fillStyle = C.blue; rr(W / 2 - 60 * ca, 1660, 120 * ca, 8, 4); ctx.fill();
  ctx.restore();
}
const fmt = s => { const m = Math.floor(s / 60), ss = (s % 60).toFixed(1); return `${m}:${ss.padStart(4, '0')}`; };

/* ===================== Các cảnh ===================== */
function sceneIntro(t, dur) {
  // hào quang
  const hk = eOut(prog(t, 0, 1.2));
  ctx.save();
  const rg = ctx.createRadialGradient(560, 1200, 0, 560, 1200, 520 * hk);
  rg.addColorStop(0, 'rgba(91,185,255,.35)'); rg.addColorStop(1, 'rgba(91,185,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 500, W, 1400);
  ctx.strokeStyle = 'rgba(44,154,240,.25)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) { const r = (320 + i * 110) * hk + Math.sin(t * 2 + i) * 6; ctx.beginPath(); ctx.arc(560, 1200, r, 0, 6.3); ctx.stroke(); }
  ctx.restore();
  // khoá trượt lên
  const lk = eOut(prog(t, .2, 1.4));
  const fin = prog(t, 2.2, 3.0);
  drawLock(640, 1200 + (1 - lk) * 700, 1.12, { hl: fin > 0 ? 'finger' : null, pulse: (Math.sin(t * 8) + 1) / 2, unlocked: eOut(prog(t, 2.8, 3.2)), okAt: 'finger' });
  // tiêu đề
  const ta = eOut(prog(t, .6, 1.3));
  ctx.save(); ctx.globalAlpha = ta;
  text('KHOÁ THÔNG MINH', W / 2, 300 - (1 - ta) * 30, { size: 34, weight: 700, color: C.blue, spacing: 8 });
  ctx.restore();
  const tb = eBack(prog(t, .8, 1.6));
  ctx.save(); ctx.globalAlpha = clamp(tb); ctx.translate(W / 2, 410); ctx.scale(lerp(.7, 1, clamp(tb)), lerp(.7, 1, clamp(tb)));
  const g = ctx.createLinearGradient(-380, 0, 380, 0); g.addColorStop(0, C.ink); g.addColorStop(1, C.blueD);
  ctx.font = `900 132px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = g; ctx.fillText(CONFIG.model, 0, 0);
  ctx.restore();
  const sa = eOut(prog(t, 1.2, 1.9));
  text(CONFIG.subtitle, W / 2, 530 + (1 - sa) * 20, { size: 48, weight: 600, color: C.ink2, alpha: sa });
  // chips
  CONFIG.chips.forEach((c, i) => {
    const k = eBack(prog(t, 1.6 + i * .15, 2.2 + i * .15));
    pill(c, 300 + i * 240, 650, { size: 28, weight: 700, alpha: clamp(k) });
  });
  // nhãn mở khoá
  const ua = eBack(prog(t, 3.0, 3.5));
  if (ua > 0) pill('Mở khoá thành công', 540, 1730, { size: 32, solid: true, c1: '#3DD39A', c2: C.ok, icon: 'check', alpha: clamp(ua) });
}

function sceneMIntro(t, dur) {
  const k = eBack(prog(t, 0, .6));
  ctx.save(); ctx.translate(W / 2, 820); ctx.scale(clamp(k, 0, 1.2), clamp(k, 0, 1.2));
  const g = ctx.createLinearGradient(0, -200, 0, 200); g.addColorStop(0, '#5BB9FF'); g.addColorStop(1, C.blueD);
  ctx.font = `900 420px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = g; ctx.fillText('6', 0, 0);
  ctx.restore();
  const a = eOut(prog(t, .3, .8));
  text('CÁCH MỞ KHOÁ', W / 2, 1110 + (1 - a) * 30, { size: 78, weight: 900, color: C.ink, alpha: a, spacing: 2 });
  text('linh hoạt cho mọi thành viên', W / 2, 1200 + (1 - a) * 30, { size: 44, weight: 500, color: C.ink2, alpha: a });
  // icon nhỏ xoay quanh
  CONFIG.methods.forEach((m, i) => {
    const ang = -Math.PI / 2 + i / 6 * Math.PI * 2 + t * .4;
    const kk = eBack(prog(t, .2 + i * .07, .7 + i * .07));
    const x = W / 2 + Math.cos(ang) * 400, y = 960 + Math.sin(ang) * 520;
    if (kk > 0) iconBubble(m.icon, x, y, 58, t, clamp(kk, 0, 1.2));
  });
}

function sceneMethods(t, dur) {
  const per = 2.0; const i = Math.min(5, Math.floor(t / per)); const lt = t - i * per;
  const m = CONFIG.methods[i];
  // tiêu đề + chấm tiến trình
  text('CÁCH MỞ KHOÁ', W / 2, 250, { size: 34, weight: 800, color: C.blue, spacing: 6 });
  for (let j = 0; j < 6; j++) {
    const on = j === i; const w = on ? 64 : 18;
    let x = W / 2 - (5 * 30 + 64) / 2; for (let q = 0; q < j; q++) x += (q === i ? 64 : 18) + 12;
    rr(x, 300, w, 18, 9); ctx.fillStyle = j <= i ? C.blue : C.blueL; ctx.fill();
  }
  // khoá bên trái
  const lockIn = eOut(prog(t, 0, .5));
  const unlocked = eOut(prog(lt, 1.15, 1.4)) * (1 - prog(lt, 1.9, 2.0));
  drawLock(390 - (1 - lockIn) * 500, 1000, .98, { hl: m.hl === 'app' || m.hl === 'key' ? null : m.hl, pulse: (Math.sin(t * 9) + 1) / 2, unlocked, okAt: m.hl === 'finger' ? 'finger' : 'glass' });

  // số thứ tự mờ
  const a = eOut(prog(lt, 0, .35)) * (1 - eOut(prog(lt, 1.8, 2.0)));
  ctx.save(); ctx.globalAlpha = a;
  text('0' + (i + 1), 810, 600, { size: 220, weight: 900, color: 'rgba(44,154,240,.12)' });
  // bong bóng icon
  const bk = eBack(prog(lt, 0, .45));
  iconBubble(m.icon, 810, 640, 135, lt, clamp(bk, 0, 1.2));
  // hiệu ứng riêng
  methodFx(i, lt);
  ctx.restore();
  // tiêu đề & mô tả
  const ty = eOut(prog(lt, .1, .5));
  ctx.save(); ctx.globalAlpha = a;
  text(m.title, 810, 880 + (1 - ty) * 40, { size: 72, weight: 900, color: C.ink });
  ctx.fillStyle = C.blue; rr(810 - 50 * ty, 940, 100 * ty, 8, 4); ctx.fill();
  const lines = wrap(m.desc, 420, 38, 500);
  lines.forEach((ln, k) => text(ln, 810, 1005 + k * 52 + (1 - ty) * 40, { size: 38, weight: 500, color: C.ink2, alpha: eOut(prog(lt, .25, .6)) }));
  ctx.restore();
  // nhãn thành công
  const ok = eBack(prog(lt, 1.2, 1.5)) * (1 - eOut(prog(lt, 1.85, 2.0)));
  if (ok > 0) pill('Đã mở khoá', 540, 1620, { size: 34, solid: true, c1: '#3DD39A', c2: C.ok, icon: 'check', alpha: clamp(ok) });
}
function methodFx(i, lt) {
  const cx = 810, cy = 640;
  if (i === 1 || i === 4) { // mã số
    const n = Math.floor(clamp(lt / 1.1) * 6);
    for (let d = 0; d < 6; d++) {
      const x = cx - 125 + d * 50, y = 1200;
      ctx.beginPath(); ctx.arc(x, y, 14, 0, 6.3);
      ctx.fillStyle = d < n ? C.blue : C.blueL; ctx.fill();
    }
    if (i === 4) text('Hiệu lực có thời hạn', cx, 1265, { size: 28, weight: 600, color: C.blue });
  }
  if (i === 2) { // thẻ bay vào khoá
    const k = eInOut(prog(lt, .3, 1.1));
    const tg = lockGeom(390, 1000, .98).P(HOT.card.x, HOT.card.y); const x = lerp(cx + 120, tg[0] - 20, k), y = lerp(cy + 520, tg[1] + 30, k);
    ctx.save(); ctx.translate(x, y); ctx.rotate(lerp(.3, -.1, k)); ctx.scale(lerp(1, .6, k), lerp(1, .6, k));
    shadowCard(-80, -50, 160, 100, 14, '#FFFFFF', 30, .25);
    const g = ctx.createLinearGradient(-80, -50, 80, 50); g.addColorStop(0, '#5BB9FF'); g.addColorStop(1, C.blueD);
    rr(-80, -50, 160, 100, 14); ctx.fillStyle = g; ctx.fill();
    ctx.fillStyle = '#FFD86B'; rr(-58, -20, 34, 26, 5); ctx.fill();
    text('EZVIZ', 30, 26, { size: 20, weight: 900, color: '#fff' });
    ctx.restore();
  }
  if (i === 3) { // sóng từ điện thoại tới khoá
    for (let w = 0; w < 4; w++) {
      const p = ((lt * 1.2 + w * .25) % 1);
      ctx.save(); ctx.globalAlpha = (1 - p) * .7; ctx.strokeStyle = C.blue; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(cx, cy, 150 + p * 260, 0, 6.3); ctx.stroke(); ctx.restore();
    }
    text('Bluetooth  •  Wi-Fi', cx, 1200, { size: 32, weight: 700, color: C.blue });
  }
  if (i === 0) { // vòng quét
    ctx.save(); ctx.strokeStyle = C.blue; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, 165, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(lt / 1.15)); ctx.stroke(); ctx.restore();
  }
  if (i === 5) {
    text('Mở bằng chìa khi cần', cx, 1200, { size: 30, weight: 600, color: C.blue });
  }
}

function sceneFeatures(t, dur) {
  const ha = eOut(prog(t, 0, .5));
  text('TÍNH NĂNG NỔI BẬT', W / 2, 250 - (1 - ha) * 30, { size: 34, weight: 800, color: C.blue, spacing: 6, alpha: ha });
  text('An toàn cho cả gia đình', W / 2, 340 - (1 - ha) * 30, { size: 62, weight: 900, color: C.ink, alpha: ha });
  const cw = 440, ch = 360, gx = 60, gy = 50, x0 = (W - (cw * 2 + gx)) / 2, y0 = 460;
  CONFIG.features.forEach((f, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const k = eBack(prog(t, .35 + i * .28, .95 + i * .28));
    if (k <= 0) return;
    const x = x0 + col * (cw + gx), y = y0 + row * (ch + gy);
    const hl = prog(t, 2.4 + i * .5, 2.9 + i * .5) * (1 - prog(t, 2.9 + i * .5, 3.4 + i * .5));
    ctx.save(); ctx.globalAlpha = clamp(k);
    ctx.translate(x + cw / 2, y + ch / 2); const sc = clamp(k, 0, 1.1) * (1 + .04 * Math.sin(hl * Math.PI)); ctx.scale(sc, sc); ctx.translate(-cw / 2, -ch / 2);
    shadowCard(0, 0, cw, ch, 40, '#FFFFFF', 40, .14);
    rr(0, 0, cw, ch, 40); ctx.strokeStyle = hl > 0 ? C.blue : 'rgba(191,226,251,.9)'; ctx.lineWidth = hl > 0 ? 4 : 2; ctx.stroke();
    // icon nền xanh nhạt
    ctx.beginPath(); ctx.arc(cw / 2, 120, 78, 0, 6.3); ctx.fillStyle = C.blueXL; ctx.fill();
    icon(f.icon, cw / 2, 120, 92, C.blue, t);
    text(f.title, cw / 2, 245, { size: 40, weight: 800, color: C.ink });
    text(f.desc, cw / 2, 300, { size: 29, weight: 500, color: C.ink2 });
    ctx.restore();
  });
}

function sceneOutro(t, dur) {
  const lk = eOut(prog(t, 0, .8));
  ctx.save();
  const rg = ctx.createRadialGradient(560, 760, 0, 560, 760, 520);
  rg.addColorStop(0, 'rgba(91,185,255,.35)'); rg.addColorStop(1, 'rgba(91,185,255,0)');
  ctx.globalAlpha = lk; ctx.fillStyle = rg; ctx.fillRect(0, 200, W, 1200); ctx.restore();
  drawBack(820, 760 + (1 - lk) * 120, 700, lk * .95);
  drawLock(470, 760 + (1 - lk) * 120, .86, { hl: 'finger', pulse: (Math.sin(t * 5) + 1) / 2 });
  const ta = eOut(prog(t, .4, 1.0));
  ctx.save(); ctx.globalAlpha = ta;
  const g = ctx.createLinearGradient(200, 0, 880, 0); g.addColorStop(0, C.ink); g.addColorStop(1, C.blueD);
  ctx.font = `900 110px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = g;
  ctx.fillText(CONFIG.model, W / 2, 1250 + (1 - ta) * 30);
  ctx.restore();
  const sa = eOut(prog(t, .7, 1.3));
  text(CONFIG.tagline, W / 2, 1350, { size: 46, weight: 600, color: C.ink2, alpha: sa });
  const ck = eBack(prog(t, 1.1, 1.6));
  if (ck > 0) {
    const pulse = 1 + .03 * Math.sin(t * 6) * prog(t, 1.6, 2);
    ctx.save(); ctx.translate(W / 2, 1480); ctx.scale(clamp(ck, 0, 1.1) * pulse, clamp(ck, 0, 1.1) * pulse);
    pill(CONFIG.cta, 0, 0, { size: 40, weight: 800, solid: true, padX: 56 });
    ctx.restore();
  }
  const ca = eOut(prog(t, 1.5, 2.0));
  ctx.save(); ctx.globalAlpha = ca;
  if (CONFIG.contact) {
    text(CONFIG.contact, W / 2, 1610, { size: 44, weight: 800, color: C.blueD });
  } else {
    ctx.save(); ctx.setLineDash([16, 12]); ctx.strokeStyle = C.blue; ctx.lineWidth = 3;
    rr(190, 1565, 700, 96, 24); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill(); ctx.stroke(); ctx.restore();
    text('[ Chèn Hotline / Địa chỉ cửa hàng ]', W / 2, 1614, { size: 32, weight: 600, color: C.blue });
  }
  ctx.restore();
}

/* ===================== Render một khung hình ===================== */
const DRAW = {
  intro: sceneIntro, mintro: sceneMIntro, methods: sceneMethods, features: sceneFeatures, outro: sceneOutro,
  slot0: (t, d) => slotScene(t, d, 0), slot1: (t, d) => slotScene(t, d, 1), slot2: (t, d) => slotScene(t, d, 2),
};
function render(T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  background(T);
  const XF = .35; // thời gian chuyển cảnh
  for (const s of SCENES) {
    const lt = T - s.start;
    if (lt < -XF || lt > s.dur + .001) continue;
    if (lt < 0) continue;
    const fin = s.start === 0 ? 1 : eOut(prog(lt, 0, XF));
    const fout = (s.id === 'outro') ? 1 : 1 - eInOut(prog(lt, s.dur - XF, s.dur));
    ctx.save();
    ctx.globalAlpha = fin * fout;
    ctx.translate(0, (1 - fin) * 40 - (1 - fout) * 40);
    DRAW[s.id](lt, s.dur);
    ctx.restore();
  }
  // fade cuối video
  const endA = prog(T, DURATION - .6, DURATION);
  if (endA > 0) { ctx.fillStyle = `rgba(255,255,255,${endA})`; ctx.fillRect(0, 0, W, H); }
  logo(T);
}
window.render = render;
window.grab = (T, q = .93) => { render(T); return cv.toDataURL('image/jpeg', q); };

/* Xem trước trong trình duyệt */
if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
