<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1-4 Portal — Từ vựng · Ngữ pháp · Luyện tập</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --ink:#1f2328; --sub:#5b6169; --border:#e4e2dd;
    --accent:#2b6cb0; --accent-ink:#ffffff;
    --hsk1:#2f9e5c; --hsk2:#2b6cb0; --hsk3:#c07a1e; --hsk4:#b5473f;
    --good:#1f8a4c; --bad:#c0392b; --good-bg:#e7f6ec; --bad-bg:#fbe9e7;
    --learned:#8a63d2;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:18px 24px;position:sticky;top:0;z-index:20;}
  header h1{margin:0 0 2px 0;font-size:20px;font-weight:700;}
  header p{margin:0;color:var(--sub);font-size:13px;}
  nav.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap;}
  nav.tabs button{border:1px solid var(--border);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:14px;cursor:pointer;font-weight:600;transition:all .15s;}
  nav.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  nav.tabs button:hover:not(.active){background:#eee;}
  main{max-width:980px;margin:0 auto;padding:20px 16px 80px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .controls input[type=text]{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;}
  .level-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:#fff;}
  .level-chip.on[data-lv="HSK1"]{background:var(--hsk1);color:#fff;border-color:var(--hsk1);}
  .level-chip.on[data-lv="HSK2"]{background:var(--hsk2);color:#fff;border-color:var(--hsk2);}
  .level-chip.on[data-lv="HSK3"]{background:var(--hsk3);color:#fff;border-color:var(--hsk3);}
  .level-chip.on[data-lv="HSK4"]{background:var(--hsk4);color:#fff;border-color:var(--hsk4);}
  .study-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;background:#fff;}
  .study-chip.on{background:var(--learned);color:#fff;border-color:var(--learned);}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;letter-spacing:.3px;}
  .badge.HSK1{background:var(--hsk1);} .badge.HSK2{background:var(--hsk2);} .badge.HSK3{background:var(--hsk3);} .badge.HSK4{background:var(--hsk4);}
  .count-note{color:var(--sub);font-size:12.5px;margin-bottom:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
  .vocab-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;position:relative;}
  .vocab-card.learned{background:#faf7ff;border-color:#d9c9f5;}
  .vocab-card .hz{font-size:22px;font-weight:600;min-width:70px;}
  .vocab-card .body{flex:1;}
  .vocab-card .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;}
  .vocab-card .pinyin{color:var(--accent);font-weight:600;font-size:14px;}
  .vocab-card .hanviet{color:var(--learned);font-weight:600;font-size:13px;}
  .vocab-card .pos{color:var(--sub);font-size:12px;font-style:italic;}
  .vocab-card .meaning{font-size:14.5px;margin:2px 0 4px;}
  .vocab-card .example{font-size:13px;color:var(--sub);line-height:1.5;}
  .vocab-card .example .zh{color:var(--ink);}
  .speak-btn{border:none;background:#eef2f6;color:var(--accent);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;flex-shrink:0;}
  .speak-btn:hover{background:#dde8f2;}
  .learn-btn{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;color:var(--sub);}
  .learn-btn.on{background:var(--learned);border-color:var(--learned);color:#fff;}
  .pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;flex-wrap:wrap;}
  .pagination button{min-width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:13.5px;}
  .pagination button.current{background:var(--ink);color:#fff;border-color:var(--ink);}
  .pagination button:disabled{opacity:.35;cursor:default;}
  .pagination .ellipsis{color:var(--sub);padding:0 2px;}
  .grammar-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .grammar-card h3{margin:4px 0 4px;font-size:17px;}
  .grammar-card .titlevi{color:var(--sub);font-size:13.5px;margin-bottom:8px;}
  .grammar-card .explain{font-size:14px;line-height:1.6;margin-bottom:8px;}
  .grammar-card .example{background:#f7f7f5;border-radius:8px;padding:8px 12px;font-size:13.5px;line-height:1.6;}
  .grammar-card .example .zh{font-weight:600;}
  .grammar-card .example .py{color:var(--accent);}
  .grammar-card .example .vi{color:var(--sub);}
  h2.section{font-size:15px;text-transform:uppercase;letter-spacing:.5px;color:var(--sub);margin:22px 0 10px;padding-top:6px;border-top:1px solid var(--border);}
  h2.section:first-child{border-top:none;margin-top:0;}
  .quiz-setup .row{margin-bottom:16px;}
  .quiz-setup label.title{display:block;font-weight:700;font-size:13.5px;margin-bottom:8px;}
  .type-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13.5px;cursor:pointer;margin:0 6px 6px 0;background:#fff;}
  .type-chip.on{background:#eef2f6;border-color:var(--accent);color:var(--accent);font-weight:700;}
  .num-choice{display:flex;gap:8px;}
  .num-choice button{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-weight:600;}
  .num-choice button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .primary-btn{background:var(--accent);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;}
  .primary-btn:hover{opacity:.9;}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;}
  .quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;color:var(--sub);}
  .progress-bar{height:6px;background:#eee;border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .progress-bar > div{height:100%;background:var(--accent);transition:width .2s;}
  .quiz-question{font-size:15px;margin-bottom:6px;color:var(--sub);}
  .quiz-prompt{font-size:26px;font-weight:700;margin-bottom:4px;}
  .quiz-sub{font-size:14px;color:var(--sub);margin-bottom:18px;}
  .quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:560px){.quiz-options{grid-template-columns:1fr;}}
  .opt-btn{text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:14.5px;cursor:pointer;line-height:1.4;}
  .opt-btn:hover:not(:disabled){border-color:var(--accent);}
  .opt-btn.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700;}
  .opt-btn.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);font-weight:700;}
  .opt-btn:disabled{cursor:default;}
  .quiz-footer{display:flex;justify-content:flex-end;margin-top:18px;}
  .score-summary{text-align:center;padding:20px 0;}
  .score-summary .big{font-size:44px;font-weight:800;margin:6px 0;}
  .review-item{border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;}
  .review-item.wrong{border-color:var(--bad);background:var(--bad-bg);}
  .review-item.ok{border-color:var(--good);background:var(--good-bg);}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px;}
</style>
</head>
<body>
<header>
  <h1>HSK 1–4 Portal</h1>
  <p>Tổng hợp từ vựng · cấu trúc ngữ pháp · bài tập luyện tập tương tác — theo giáo trình chuẩn HSK (2012, 5 cấp độ)</p>
  <nav class="tabs">
    <button data-view="vocab" class="active">📖 Từ vựng</button>
    <button data-view="grammar">🧩 Ngữ pháp</button>
    <button data-view="quiz">✍️ Luyện tập</button>
  </nav>
</header>
<main>

  <section id="view-vocab">
    <div class="panel">
      <div class="controls">
        <input type="text" id="vocab-search" placeholder="Tìm theo hán tự, pinyin, hán việt, hoặc nghĩa tiếng Việt...">
      </div>
      <div class="controls" id="vocab-level-chips"></div>
      <div class="controls" id="vocab-study-chips">
        <span class="study-chip on" data-study="all">Tất cả</span>
        <span class="study-chip" data-study="learned">✓ Đã học</span>
        <span class="study-chip" data-study="unlearned">Chưa học</span>
      </div>
      <div class="count-note"><span id="vocab-count"></span><span id="learned-count"></span></div>
      <div id="vocab-list"></div>
      <div class="pagination" id="vocab-pagination"></div>
    </div>
  </section>

  <section id="view-grammar" style="display:none;">
    <div class="panel">
      <div class="controls" id="grammar-level-chips"></div>
      <div class="count-note"><span id="grammar-count"></span></div>
      <div id="grammar-list"></div>
    </div>
  </section>

  <section id="view-quiz" style="display:none;">
    <div class="panel" id="quiz-container"></div>
  </section>

</main>
<footer>Dữ liệu biên soạn dựa trên giáo trình chuẩn HSK 1–4 (2012) · Dùng cho mục đích tự học</footer>

ở hữu \"的\"", "explanation_vi": "\"的\" nối định ngữ với danh từ trung tâm để chỉ sự sở hữu hoặc miêu tả. Cấu trúc: N1/Đại từ + 的 + N2.", "example_zh": "这是我的书。", "example_pinyin": "Zhè shì wǒ de shū.", "example_vi": "Đây là sách của tôi."}, {"level": "HSK1", "title_zh": "在 表示位置", "title_vi": "Động từ \"在\" chỉ vị trí", "explanation_vi": "\"在\" làm động từ chỉ vị trí tồn tại. Cấu trúc: S + 在 + địa điểm.", "example_zh": "我的书在桌子上。", "example_pinyin": "Wǒ de shū zài zhuōzi shàng.", "example_vi": "Sách của tôi ở trên bàn."}, {"level": "HSK1", "title_zh": "量词短语 (数词+量词+名词)", "title_vi": "Cụm số từ + lượng từ + danh từ", "explanation_vi": "Giữa số từ và danh từ phải có lượng từ phù hợp. Cấu trúc: Số từ + Lượng từ + N.", "example_zh": "我有三本书。", "example_pinyin": "Wǒ yǒu sān běn shū.", "example_vi": "Tôi có ba quyển sách."}, {"level": "HSK1", "title_zh": "了 (完成/变化)", "title_vi": "Trợ từ \"了\" chỉ hoàn thành/thay đổi", "explanation_vi": "\"了\" đặt sau động từ biểu thị hành động đã hoàn thành, hoặc cuối câu biểu thị sự thay đổi trạng thái. Cấu trúc: V + 了 (+O) hoặc S + Adj/V + 了.", "example_zh": "我吃饭了。", "example_pinyin": "Wǒ chī fàn le.", "example_vi": "Tôi ăn cơm rồi."}, {"level": "HSK1", "title_zh": "时间词作状语", "title_vi": "Từ chỉ thời gian làm trạng ngữ", "explanation_vi": "Từ chỉ thời gian đặt trước động từ (sau chủ ngữ) để làm trạng ngữ chỉ thời gian. Cấu trúc: S + Thời gian + V.", "example_zh": "我明天去北京。", "example_pinyin": "Wǒ míngtiān qù Běijīng.", "example_vi": "Ngày mai tôi đi Bắc Kinh."}, {"level": "HSK1", "title_zh": "也 (phó từ)", "title_vi": "Phó từ \"cũng\"", "explanation_vi": "\"也\" đặt trước động từ/tính từ để diễn đạt sự tương tự. Cấu trúc: S + 也 + V/Adj.", "example_zh": "我也是学生。", "example_pinyin": "Wǒ yě shì xuésheng.", "example_vi": "Tôi cũng là học sinh."}, {"level": "HSK1", "title_zh": "都 (phó từ)", "title_vi": "Phó từ \"đều\"", "explanation_vi": "\"都\" đặt trước động từ/tính từ để chỉ toàn bộ đối tượng đã nêu. Cấu trúc: S(số nhiều) + 都 + V/Adj.", "example_zh": "我们都是中国人。", "example_pinyin": "Wǒmen dōu shì Zhōngguó rén.", "example_vi": "Chúng tôi đều là người Trung Quốc."}, {"level": "HSK1", "title_zh": "想/要 + V", "title_vi": "Động từ năng nguyện chỉ mong muốn", "explanation_vi": "\"想\" hoặc \"要\" đặt trước động từ để diễn tả mong muốn làm việc gì. Cấu trúc: S + 想/要 + V.", "example_zh": "我想喝水。", "example_pinyin": "Wǒ xiǎng hē shuǐ.", "example_vi": "Tôi muốn uống nước."}, {"level": "HSK1", "title_zh": "会 (năng lực do học)", "title_vi": "Động từ năng nguyện \"会\"", "explanation_vi": "\"会\" diễn tả khả năng có được nhờ học tập/rèn luyện. Cấu trúc: S + 会 + V.", "example_zh": "我会说汉语。", "example_pinyin": "Wǒ huì shuō Hànyǔ.", "example_vi": "Tôi biết nói tiếng Trung."}, {"level": "HSK1", "title_zh": "年龄表达法", "title_vi": "Cách diễn đạt tuổi", "explanation_vi": "Diễn đạt tuổi bằng cách đặt số từ trực tiếp sau chủ ngữ (không cần \"是\"), có thể thêm \"岁\". Cấu trúc: S + Số + 岁.", "example_zh": "我今年二十岁。", "example_pinyin": "Wǒ jīnnián èrshí suì.", "example_vi": "Năm nay tôi 20 tuổi."}, {"level": "HSK1", "title_zh": "太...了", "title_vi": "Cấu trúc \"quá...\"", "explanation_vi": "Diễn tả mức độ vượt quá, thường mang sắc thái cảm thán. Cấu trúc: 太 + Adj + 了.", "example_zh": "今天太热了。", "example_pinyin": "Jīntiān tài rè le.", "example_vi": "Hôm nay nóng quá."}, {"level": "HSK1", "title_zh": "一点儿 (định ngữ danh từ)", "title_vi": "Một chút - định ngữ cho danh từ", "explanation_vi": "\"一点儿\" đặt sau động từ và trước danh từ để chỉ số lượng nhỏ, không xác định. Cấu trúc: V + 一点儿 + N.", "example_zh": "我想喝一点儿水。", "example_pinyin": "Wǒ xiǎng hē yìdiǎnr shuǐ.", "example_vi": "Tôi muốn uống một chút nước."}, {"level": "HSK1", "title_zh": "从...到...", "title_vi": "Cấu trúc \"từ...đến...\"", "explanation_vi": "Diễn tả điểm bắt đầu và kết thúc về thời gian hoặc không gian. Cấu trúc: 从 + A + 到 + B.", "example_zh": "我从八点到九点上课。", "example_pinyin": "Wǒ cóng bā diǎn dào jiǔ diǎn shàngkè.", "example_vi": "Tôi học từ 8 giờ đến 9 giờ."}, {"level": "HSK1", "title_zh": "和...一起", "title_vi": "Cấu trúc \"cùng với...\"", "explanation_vi": "Diễn tả hành động được thực hiện cùng với ai đó. Cấu trúc: S + 和 + N + 一起 + V.", "example_zh": "我和朋友一起去公园。", "example_pinyin": "Wǒ hé péngyou yìqǐ qù gōngyuán.", "example_vi": "Tôi cùng bạn đi công viên."}, {"level": "HSK2", "title_zh": "比字句", "title_vi": "So sánh hơn với \"比\"", "explanation_vi": "So sánh hơn giữa A và B. Cấu trúc: A + 比 + B + (更/还) + Adj.", "example_zh": "今天比昨天热。", "example_pinyin": "Jīntiān bǐ zuótiān rè.", "example_vi": "Hôm nay nóng hơn hôm qua."}, {"level": "HSK2", "title_zh": "比 + Adj + 一点儿", "title_vi": "So sánh với mức chênh lệch nhỏ", "explanation_vi": "Đặt \"一点儿\" sau tính từ trong câu so sánh \"比\" để chỉ sự chênh lệch nhỏ. Cấu trúc: A + 比 + B + Adj + 一点儿.", "example_zh": "我比他高一点儿。", "example_pinyin": "Wǒ bǐ tā gāo yìdiǎnr.", "example_vi": "Tôi cao hơn anh ấy một chút."}, {"level": "HSK2", "title_zh": "有一点儿 + Adj", "title_vi": "Hơi... một chút", "explanation_vi": "\"有一点儿\" đặt trước tính từ (thường mang nghĩa tiêu cực) để diễn tả mức độ nhẹ. Cấu trúc: S + 有一点儿 + Adj.", "example_zh": "我有一点儿累。", "example_pinyin": "Wǒ yǒu yìdiǎnr lèi.", "example_vi": "Tôi hơi mệt một chút."}, {"level": "HSK2", "title_zh": "过 (经验体)", "title_vi": "Trợ từ động thái \"过\" - kinh nghiệm", "explanation_vi": "\"过\" đặt sau động từ để diễn tả kinh nghiệm đã từng trải qua. Phủ định: 没 + V + 过. Cấu trúc: S + V + 过 + O.", "example_zh": "我去过中国。", "example_pinyin": "Wǒ qùguo Zhōngguó.", "example_vi": "Tôi đã từng đến Trung Quốc."}, {"level": "HSK2", "title_zh": "着 (持续体)", "title_vi": "Trợ từ động thái \"着\" - tiếp diễn", "explanation_vi": "\"着\" đặt sau động từ để diễn tả trạng thái đang tiếp diễn. Cấu trúc: S + V + 着 (+O).", "example_zh": "门开着。", "example_pinyin": "Mén kāizhe.", "example_vi": "Cửa đang mở."}, {"level": "HSK2", "title_zh": "快/就要...了", "title_vi": "Sắp... rồi", "explanation_vi": "Diễn tả một việc sắp xảy ra trong tương lai gần. Cấu trúc: 快/就要 + V + 了.", "example_zh": "我们快要到了。", "example_pinyin": "Wǒmen kuàiyào dào le.", "example_vi": "Chúng tôi sắp đến rồi."}, {"level": "HSK2", "title_zh": "简单趋向补语 (上/下/进/出+来/去)", "title_vi": "Bổ ngữ xu hướng đơn giản", "explanation_vi": "Bổ ngữ xu hướng đơn giản đặt sau động từ để chỉ hướng di chuyển so với người nói. Cấu trúc: V + 上/下/进/出/回/过 + 来/去.", "example_zh": "他走进来了。", "example_pinyin": "Tā zǒu jìnlái le.", "example_vi": "Anh ấy đi vào."}, {"level": "HSK2", "title_zh": "又...又...", "title_vi": "Vừa... vừa...", "explanation_vi": "Diễn tả hai đặc điểm hoặc hành động cùng tồn tại. Cấu trúc: 又 + Adj/V + 又 + Adj/V.", "example_zh": "这个菜又好吃又便宜。", "example_pinyin": "Zhège cài yòu hǎochī yòu piányi.", "example_vi": "Món này vừa ngon vừa rẻ."}, {"level": "HSK2", "title_zh": "虽然...但是...", "title_vi": "Mặc dù... nhưng...", "explanation_vi": "Diễn tả sự nhượng bộ, mặc dù vế trước nhưng vế sau vẫn xảy ra. Cấu trúc: 虽然 + A, 但是 + B.", "example_zh": "虽然下雨，但是我们还是去公园。", "example_pinyin": "Suīrán xiàyǔ, dànshì wǒmen háishi qù gōngyuán.", "example_vi": "Mặc dù trời mưa nhưng chúng tôi vẫn đi công viên."}, {"level": "HSK2", "title_zh": "因为...所以...", "title_vi": "Vì... nên...", "explanation_vi": "Diễn tả quan hệ nhân quả. Cấu trúc: 因为 + Nguyên nhân, 所以 + Kết quả.", "example_zh": "因为下雨，所以我没去。", "example_pinyin": "Yīnwèi xiàyǔ, suǒyǐ wǒ méi qù.", "example_vi": "Vì trời mưa nên tôi không đi."}, {"level": "HSK2", "title_zh": "先...然后...", "title_vi": "Trước tiên... sau đó...", "explanation_vi": "Diễn tả trình tự hành động trước sau. Cấu trúc: 先 + A, 然后 + B.", "example_zh": "我先吃饭，然后睡觉。", "example_pinyin": "Wǒ xiān chīfàn, ránhòu shuìjiào.", "example_vi": "Tôi ăn cơm trước, sau đó đi ngủ."}, {"level": "HSK2", "title_zh": "可以 (cho phép)", "title_vi": "Động từ năng nguyện \"có thể\" (cho phép)", "explanation_vi": "\"可以\" diễn tả sự cho phép hoặc khả năng khách quan. Cấu trúc: S + 可以 + V.", "example_zh": "你可以进来。", "example_pinyin": "Nǐ kěyǐ jìnlái.", "example_vi": "Bạn có thể vào."}, {"level": "HSK2", "title_zh": "应该 (nên)", "title_vi": "Động từ năng nguyện \"nên\"", "explanation_vi": "\"应该\" diễn tả sự cần thiết, nghĩa vụ, khuyên nhủ. Cấu trúc: S + 应该 + V.", "example_zh": "你应该多休息。", "example_pinyin": "Nǐ yīnggāi duō xiūxi.", "example_vi": "Bạn nên nghỉ ngơi nhiều hơn."}, {"level": "HSK2", "title_zh": "双宾语句", "title_vi": "Câu song tân ngữ", "explanation_vi": "Một số động từ có thể mang hai tân ngữ: người rồi đến vật. Cấu trúc: S + V + O(người) + O(vật).", "example_zh": "老师教我们汉语。", "example_pinyin": "Lǎoshī jiāo wǒmen Hànyǔ.", "example_vi": "Giáo viên dạy chúng tôi tiếng Trung."}, {"level": "HSK2", "title_zh": "或者 与 还是", "title_vi": "Hoặc là / hay là", "explanation_vi": "\"或者\" dùng trong câu trần thuật để chỉ sự lựa chọn; \"还是\" dùng trong câu hỏi lựa chọn. Cấu trúc: A + 或者/还是 + B.", "example_zh": "你喝茶还是喝咖啡？", "example_pinyin": "Nǐ hē chá háishi hē kāfēi?", "example_vi": "Bạn uống trà hay uống cà phê?"}, {"level": "HSK2", "title_zh": "程度补语 V/Adj + 得 + Complement", "title_vi": "Bổ ngữ trình độ với \"得\"", "explanation_vi": "\"得\" nối động từ/tính từ với bổ ngữ để miêu tả mức độ hoặc trạng thái. Cấu trúc: V + 得 + Adj.", "example_zh": "他跑得很快。", "example_pinyin": "Tā pǎo de hěn kuài.", "example_vi": "Anh ấy chạy rất nhanh."}, {"level": "HSK2", "title_zh": "更 (phó từ so sánh)", "title_vi": "Càng, hơn nữa", "explanation_vi": "\"更\" thêm vào trước tính từ trong so sánh để nhấn mạnh mức độ cao hơn. Cấu trúc: S + 更 + Adj.", "example_zh": "这个更好。", "example_pinyin": "Zhège gèng hǎo.", "example_vi": "Cái này tốt hơn nữa."}, {"level": "HSK2", "title_zh": "要是...就...", "title_vi": "Nếu... thì...", "explanation_vi": "Diễn tả điều kiện giả định, nếu... thì... Cấu trúc: 要是 + Điều kiện, 就 + Kết quả.", "example_zh": "要是明天下雨，我就不去了。", "example_pinyin": "Yàoshi míngtiān xiàyǔ, wǒ jiù bú qù le.", "example_vi": "Nếu ngày mai trời mưa thì tôi sẽ không đi."}, {"level": "HSK2", "title_zh": "别 (mệnh lệnh phủ định)", "title_vi": "Đừng...", "explanation_vi": "\"别\" đặt trước động từ để yêu cầu ai đó không làm gì. Cấu trúc: 别 + V (+了).", "example_zh": "别担心。", "example_pinyin": "Bié dānxīn.", "example_vi": "Đừng lo lắng."}, {"level": "HSK2", "title_zh": "正在...(呢)", "title_vi": "Đang...", "explanation_vi": "\"正在\" đặt trước động từ diễn tả hành động đang diễn ra, thường kết hợp với \"呢\" ở cuối câu. Cấu trúc: S + 正在 + V (+呢).", "example_zh": "我正在吃饭呢。", "example_pinyin": "Wǒ zhèngzài chīfàn ne.", "example_vi": "Tôi đang ăn cơm."}, {"level": "HSK2", "title_zh": "多 + Adj (câu hỏi mức độ)", "title_vi": "Hỏi về mức độ với \"多\"", "explanation_vi": "\"多\" + tính từ đơn âm dùng để hỏi về mức độ, số lượng. Cấu trúc: 多 + Adj？", "example_zh": "你今年多大？", "example_pinyin": "Nǐ jīnnián duō dà?", "example_vi": "Năm nay bạn bao nhiêu tuổi?"}, {"level": "HSK2", "title_zh": "以前/以后", "title_vi": "Trước đây / sau này", "explanation_vi": "Đặt sau cụm từ chỉ thời gian/sự việc để biểu thị mốc thời gian trước hoặc sau. Cấu trúc: (Thời điểm) + 以前/以后.", "example_zh": "三年以后我要回国。", "example_pinyin": "Sān nián yǐhòu wǒ yào huíguó.", "example_vi": "Ba năm sau tôi sẽ về nước."}, {"level": "HSK2", "title_zh": "每...都...", "title_vi": "Mỗi... đều...", "explanation_vi": "\"每\" kết hợp với \"都\" diễn tả tính phổ quát cho từng cá thể. Cấu trúc: 每 + N + 都 + V.", "example_zh": "我每天都学习汉语。", "example_pinyin": "Wǒ měitiān dōu xuéxí Hànyǔ.", "example_vi": "Mỗi ngày tôi đều học tiếng Trung."}, {"level": "HSK3", "title_zh": "把字句", "title_vi": "Câu chữ \"把\"", "explanation_vi": "Dùng để nhấn mạnh sự tác động và kết quả xử lý lên tân ngữ xác định. Cấu trúc: S + 把 + O + V + Bổ ngữ/thành phần khác (V không được đứng một mình).", "example_zh": "我把作业做完了。", "example_pinyin": "Wǒ bǎ zuòyè zuò wán le.", "example_vi": "Tôi đã làm xong bài tập."}, {"level": "HSK3", "title_zh": "被字句", "title_vi": "Câu bị động với \"被\"", "explanation_vi": "Diễn tả chủ ngữ chịu tác động của hành động. Cấu trúc: S(受事) + 被 + (施事) + V + thành phần khác.", "example_zh": "我的手机被他拿走了。", "example_pinyin": "Wǒ de shǒujī bèi tā ná zǒu le.", "example_vi": "Điện thoại của tôi bị anh ấy lấy đi mất."}, {"level": "HSK3", "title_zh": "是...的 强调句", "title_vi": "Câu nhấn mạnh \"是...的\"", "explanation_vi": "Nhấn mạnh thời gian, địa điểm, cách thức... của một hành động đã xảy ra. Cấu trúc: S + 是 + (thời gian/địa điểm/cách thức) + V + 的.", "example_zh": "我是昨天来的。", "example_pinyin": "Wǒ shì zuótiān lái de.", "example_vi": "Tôi đến (là) vào hôm qua."}, {"level": "HSK3", "title_zh": "可能补语 V得/不 + Complement", "title_vi": "Bổ ngữ khả năng", "explanation_vi": "Diễn tả khả năng có thể hay không thể đạt được kết quả của hành động. Cấu trúc: V + 得/不 + Kết quả bổ ngữ.", "example_zh": "这个字我看不懂。", "example_pinyin": "Zhège zì wǒ kàn bu dǒng.", "example_vi": "Chữ này tôi xem không hiểu."}, {"level": "HSK3", "title_zh": "结果补语 (V + 完/好/到/懂/见...)", "title_vi": "Bổ ngữ kết quả", "explanation_vi": "Bổ ngữ kết quả đặt ngay sau động từ để chỉ kết quả của hành động. Cấu trúc: V + Kết quả bổ ngữ (+O).", "example_zh": "我听懂了。", "example_pinyin": "Wǒ tīngdǒng le.", "example_vi": "Tôi nghe hiểu rồi."}, {"level": "HSK3", "title_zh": "时量补语 (V + 了 + 时间)", "title_vi": "Bổ ngữ thời lượng", "explanation_vi": "Diễn tả khoảng thời gian một hành động diễn ra. Cấu trúc: S + V + 了 + Thời lượng (+O).", "example_zh": "我学了三年汉语。", "example_pinyin": "Wǒ xuéle sān nián Hànyǔ.", "example_vi": "Tôi đã học tiếng Trung ba năm."}, {"level": "HSK3", "title_zh": "动量补语 (V + 数 + 次/遍)", "title_vi": "Bổ ngữ số lần", "explanation_vi": "Diễn tả số lần thực hiện hành động. Cấu trúc: S + V + Số + 次/遍 (+O).", "example_zh": "我去过两次中国。", "example_pinyin": "Wǒ qùguo liǎng cì Zhōngguó.", "example_vi": "Tôi đã đến Trung Quốc hai lần."}, {"level": "HSK3", "title_zh": "越来越 + Adj", "title_vi": "Ngày càng...", "explanation_vi": "Diễn tả mức độ tăng dần theo thời gian. Cấu trúc: S + 越来越 + Adj.", "example_zh": "天气越来越冷了。", "example_pinyin": "Tiānqì yuè lái yuè lěng le.", "example_vi": "Thời tiết ngày càng lạnh."}, {"level": "HSK3", "title_zh": "一边...一边...", "title_vi": "Vừa... vừa... (đồng thời)", "explanation_vi": "Diễn tả hai hành động xảy ra đồng thời. Cấu trúc: 一边 + V1, 一边 + V2.", "example_zh": "他一边吃饭一边看电视。", "example_pinyin": "Tā yìbiān chīfàn yìbiān kàn diànshì.", "example_vi": "Anh ấy vừa ăn cơm vừa xem tivi."}, {"level": "HSK3", "title_zh": "不但...而且...", "title_vi": "Không chỉ... mà còn...", "explanation_vi": "Diễn tả quan hệ tăng tiến, không chỉ... mà còn... Cấu trúc: 不但 + A, 而且 + B.", "example_zh": "她不但漂亮，而且聪明。", "example_pinyin": "Tā búdàn piàoliang, érqiě cōngming.", "example_vi": "Cô ấy không chỉ xinh đẹp mà còn thông minh."}, {"level": "HSK3", "title_zh": "只有...才...", "title_vi": "Chỉ có... mới...", "explanation_vi": "Diễn tả điều kiện duy nhất, chỉ khi... mới... Cấu trúc: 只有 + Điều kiện, 才 + Kết quả.", "example_zh": "只有努力学习，才能成功。", "example_pinyin": "Zhǐyǒu nǔlì xuéxí, cái néng chénggōng.", "example_vi": "Chỉ có nỗ lực học tập mới có thể thành công."}, {"level": "HSK3", "title_zh": "除了...以外，都/也...", "title_vi": "Ngoài... ra, đều/cũng...", "explanation_vi": "Diễn tả sự loại trừ một đối tượng khỏi phần còn lại. Cấu trúc: 除了 + A 以外，都/也 + B.", "example_zh": "除了小李以外，大家都来了。", "example_pinyin": "Chúle Xiǎo Lǐ yǐwài, dàjiā dōu lái le.", "example_vi": "Ngoài Tiểu Lý ra, mọi người đều đến rồi."}, {"level": "HSK3", "title_zh": "动词重叠 (AA/A一A/A了A)", "title_vi": "Lặp động từ", "explanation_vi": "Lặp lại động từ để diễn tả hành động ngắn, nhẹ nhàng, thử làm. Cấu trúc: V + V hoặc V + 一 + V.", "example_zh": "我们去公园看看吧。", "example_pinyin": "Wǒmen qù gōngyuán kànkan ba.", "example_vi": "Chúng ta đi công viên xem thử đi."}, {"level": "HSK3", "title_zh": "形容词重叠 AABB", "title_vi": "Lặp tính từ dạng AABB", "explanation_vi": "Lặp lại tính từ hai âm tiết theo dạng AABB để tăng mức độ miêu tả sinh động. Cấu trúc: AABB.", "example_zh": "房间干干净净的。", "example_pinyin": "Fángjiān gāngānjìngjìng de.", "example_vi": "Căn phòng sạch sẽ tinh tươm."}, {"level": "HSK3", "title_zh": "跟...(不)一样", "title_vi": "Giống/khác với...", "explanation_vi": "So sánh sự giống nhau/khác nhau giữa hai đối tượng. Cấu trúc: A + 跟 + B + (不)一样.", "example_zh": "我的想法跟你不一样。", "example_pinyin": "Wǒ de xiǎngfǎ gēn nǐ bù yíyàng.", "example_vi": "Suy nghĩ của tôi khác với bạn."}, {"level": "HSK3", "title_zh": "A没有B(这么/那么)Adj", "title_vi": "So sánh kém với \"没有\"", "explanation_vi": "So sánh kém, A không bằng B. Cấu trúc: A + 没有 + B + (这么/那么) + Adj.", "example_zh": "我没有他那么高。", "example_pinyin": "Wǒ méiyǒu tā nàme gāo.", "example_vi": "Tôi không cao bằng anh ấy."}, {"level": "HSK3", "title_zh": "如果...就...", "title_vi": "Nếu... thì... (giả định)", "explanation_vi": "Diễn tả điều kiện giả định. Cấu trúc: 如果 + Điều kiện, 就 + Kết quả.", "example_zh": "如果你有时间，就来找我。", "example_pinyin": "Rúguǒ nǐ yǒu shíjiān, jiù lái zhǎo wǒ.", "example_vi": "Nếu bạn có thời gian thì hãy đến tìm tôi."}, {"level": "HSK3", "title_zh": "只要...就...", "title_vi": "Chỉ cần... là...", "explanation_vi": "Diễn tả điều kiện đủ, chỉ cần... là... Cấu trúc: 只要 + Điều kiện, 就 + Kết quả.", "example_zh": "只要你努力，就一定能成功。", "example_pinyin": "Zhǐyào nǐ nǔlì, jiù yídìng néng chénggōng.", "example_vi": "Chỉ cần bạn cố gắng là chắc chắn sẽ thành công."}, {"level": "HSK3", "title_zh": "为了 (mục đích)", "title_vi": "Để... (nêu mục đích)", "explanation_vi": "\"为了\" đặt đầu câu để nêu mục đích của hành động. Cấu trúc: 为了 + Mục đích, S + V.", "example_zh": "为了学好汉语，我每天都练习。", "example_pinyin": "Wèile xuéhǎo Hànyǔ, wǒ měitiān dōu liànxí.", "example_vi": "Để học tốt tiếng Trung, tôi luyện tập mỗi ngày."}, {"level": "HSK3", "title_zh": "好像 (dường như)", "title_vi": "Dường như, có vẻ", "explanation_vi": "Diễn tả sự phỏng đoán, cảm giác không chắc chắn. Cấu trúc: S + 好像 + Mệnh đề.", "example_zh": "他好像不太高兴。", "example_pinyin": "Tā hǎoxiàng bú tài gāoxìng.", "example_vi": "Anh ấy có vẻ không vui lắm."}, {"level": "HSK3", "title_zh": "差点儿 (suýt nữa)", "title_vi": "Suýt nữa", "explanation_vi": "Diễn tả việc suýt xảy ra (thường ngoài ý muốn). Cấu trúc: S + 差点儿 + V.", "example_zh": "我差点儿迟到了。", "example_pinyin": "Wǒ chàdiǎnr chídào le.", "example_vi": "Tôi suýt nữa bị trễ."}, {"level": "HSK3", "title_zh": "存现句 (地点+有/是+N)", "title_vi": "Câu tồn tại", "explanation_vi": "Câu tồn tại diễn tả sự vật tồn tại tại một địa điểm. Cấu trúc: Địa điểm + 有/是 + N.", "example_zh": "桌子上有一本书。", "example_pinyin": "Zhuōzi shàng yǒu yì běn shū.", "example_vi": "Trên bàn có một quyển sách."}, {"level": "HSK3", "title_zh": "把 + O + V + 一下/了", "title_vi": "Câu \"把\" với động tác ngắn", "explanation_vi": "Cấu trúc \"把\" kết hợp với động từ mang bổ ngữ ngắn/hoàn thành để diễn tả xử lý sự vật cụ thể. Cấu trúc: S + 把 + O + V + 一下/了.", "example_zh": "请把门关一下。", "example_pinyin": "Qǐng bǎ mén guān yíxià.", "example_vi": "Làm ơn đóng cửa lại một chút."}, {"level": "HSK3", "title_zh": "于是 (thế là)", "title_vi": "Thế là, do đó", "explanation_vi": "Liên từ diễn tả kết quả tự nhiên tiếp nối sự việc trước đó. Cấu trúc: A, 于是 + B.", "example_zh": "下雨了，于是我们没出去。", "example_pinyin": "Xiàyǔ le, yúshì wǒmen méi chūqù.", "example_vi": "Trời mưa rồi, thế là chúng tôi không ra ngoài."}, {"level": "HSK3", "title_zh": "一...也/都不/没...", "title_vi": "Phủ định tuyệt đối \"一...cũng không\"", "explanation_vi": "Nhấn mạnh sự phủ định tuyệt đối, không một... nào. Cấu trúc: 一 + Lượng từ + N + 也/都 + 不/没 + V.", "example_zh": "我一点儿也不累。", "example_pinyin": "Wǒ yìdiǎnr yě bú lèi.", "example_vi": "Tôi không mệt chút nào."}, {"level": "HSK3", "title_zh": "比 + 数量差", "title_vi": "So sánh kèm mức chênh lệch cụ thể", "explanation_vi": "Trong câu so sánh \"比\", thêm số lượng cụ thể để chỉ mức chênh lệch giữa hai đối tượng. Cấu trúc: A + 比 + B + Adj + Số lượng.", "example_zh": "我比弟弟大两岁。", "example_pinyin": "Wǒ bǐ dìdi dà liǎng suì.", "example_vi": "Tôi hơn em trai hai tuổi."}, {"level": "HSK3", "title_zh": "又 + V + 了 (lặp lại thực tế)", "title_vi": "Lại... (hành động lặp lại đã xảy ra)", "explanation_vi": "\"又\" đặt trước động từ diễn tả một hành động đã xảy ra lặp lại thêm lần nữa (mang tính thực tế, đã xảy ra). Cấu trúc: S + 又 + V + 了.", "example_zh": "他又迟到了。", "example_pinyin": "Tā yòu chídào le.", "example_vi": "Anh ấy lại đến muộn rồi."}, {"level": "HSK3", "title_zh": "数词 + 多 (số lượng ước chừng)", "title_vi": "Hơn... (số lượng ước chừng)", "explanation_vi": "\"多\" đặt sau số từ để diễn tả số lượng ước chừng, nhiều hơn con số đó. Cấu trúc: Số + 多 + Lượng từ + N.", "example_zh": "他买了十多本书。", "example_pinyin": "Tā mǎile shí duō běn shū.", "example_vi": "Anh ấy đã mua hơn mười quyển sách."}, {"level": "HSK4", "title_zh": "把字句 (结合趋向/结果补语)", "title_vi": "Câu \"把\" nâng cao (kết hợp bổ ngữ xu hướng/kết quả)", "explanation_vi": "Cấu trúc \"把\" nâng cao, tân ngữ được xử lý và di chuyển/biến đổi với bổ ngữ xu hướng hoặc kết quả phức tạp. Cấu trúc: S + 把 + O + V + Bổ ngữ xu hướng/kết quả phức hợp.", "example_zh": "他把桌子搬到楼上去了。", "example_pinyin": "Tā bǎ zhuōzi bān dào lóushàng qù le.", "example_vi": "Anh ấy đã khiêng cái bàn lên lầu trên."}, {"level": "HSK4", "title_zh": "被字句 (带复杂补语)", "title_vi": "Câu bị động nâng cao", "explanation_vi": "Câu bị động nâng cao, thường diễn tả kết quả không mong muốn với bổ ngữ phức tạp. Cấu trúc: S + 被 + (Chủ thể) + V + Bổ ngữ phức tạp.", "example_zh": "我的钱包被小偷偷走了。", "example_pinyin": "Wǒ de qiánbāo bèi xiǎotōu tōu zǒu le.", "example_vi": "Ví tiền của tôi bị kẻ trộm lấy mất."}, {"level": "HSK4", "title_zh": "尽管...但是/可是...", "title_vi": "Mặc dù... nhưng... (văn viết)", "explanation_vi": "Diễn tả sự nhượng bộ mạnh hơn \"虽然\", thường dùng trong văn viết. Cấu trúc: 尽管 + A, 但是/可是 + B.", "example_zh": "尽管很累，他还是坚持工作。", "example_pinyin": "Jǐnguǎn hěn lèi, tā háishi jiānchí gōngzuò.", "example_vi": "Mặc dù rất mệt, anh ấy vẫn kiên trì làm việc."}, {"level": "HSK4", "title_zh": "无论...都...", "title_vi": "Bất luận/dù... cũng...", "explanation_vi": "Diễn tả trong bất kỳ điều kiện nào kết quả cũng không đổi. Cấu trúc: 无论 + Điều kiện (thường có từ nghi vấn/或者), 都 + Kết quả.", "example_zh": "无论天气怎么样，我们都要出发。", "example_pinyin": "Wúlùn tiānqì zěnmeyàng, wǒmen dōu yào chūfā.", "example_vi": "Dù thời tiết thế nào, chúng tôi cũng phải xuất phát."}, {"level": "HSK4", "title_zh": "不管...都...", "title_vi": "Bất kể... cũng...", "explanation_vi": "Tương tự \"无论\", mang sắc thái khẩu ngữ hơn. Cấu trúc: 不管 + Điều kiện, 都 + Kết quả.", "example_zh": "不管多难，他都不放弃。", "example_pinyin": "Bùguǎn duō nán, tā dōu bú fàngqì.", "example_vi": "Dù khó khăn thế nào, anh ấy cũng không từ bỏ."}, {"level": "HSK4", "title_zh": "宁可...也不...", "title_vi": "Thà... còn hơn...", "explanation_vi": "Diễn tả sự lựa chọn thà làm việc này còn hơn làm việc kia. Cấu trúc: 宁可 + A, 也不 + B.", "example_zh": "我宁可走路，也不想挤公交车。", "example_pinyin": "Wǒ nìngkě zǒulù, yě bù xiǎng jǐ gōngjiāochē.", "example_vi": "Tôi thà đi bộ còn hơn phải chen chúc trên xe buýt."}, {"level": "HSK4", "title_zh": "由于...因此...", "title_vi": "Do... nên... (văn viết trang trọng)", "explanation_vi": "Diễn tả quan hệ nhân quả trang trọng, dùng trong văn viết. Cấu trúc: 由于 + Nguyên nhân, 因此 + Kết quả.", "example_zh": "由于交通堵塞，因此他迟到了。", "example_pinyin": "Yóuyú jiāotōng dǔsè, yīncǐ tā chídào le.", "example_vi": "Do tắc đường nên anh ấy đã đến muộn."}, {"level": "HSK4", "title_zh": "除非...否则...", "title_vi": "Trừ khi... nếu không...", "explanation_vi": "Diễn tả điều kiện bắt buộc duy nhất, nếu không sẽ có kết quả xấu. Cấu trúc: 除非 + Điều kiện, 否则 + Kết quả.", "example_zh": "除非你道歉，否则她不会原谅你。", "example_pinyin": "Chúfēi nǐ dàoqiàn, fǒuzé tā bú huì yuánliàng nǐ.", "example_vi": "Trừ khi bạn xin lỗi, nếu không cô ấy sẽ không tha thứ cho bạn."}, {"level": "HSK4", "title_zh": "一...就...", "title_vi": "Vừa... là... (liên tiếp ngay lập tức)", "explanation_vi": "Diễn tả hai hành động xảy ra liên tiếp ngay lập tức. Cấu trúc: 一 + V1, 就 + V2.", "example_zh": "他一下课就回家了。", "example_pinyin": "Tā yí xiàkè jiù huíjiā le.", "example_vi": "Anh ấy vừa tan học là về nhà ngay."}, {"level": "HSK4", "title_zh": "不仅...还/也...", "title_vi": "Không chỉ... mà còn... (linh hoạt)", "explanation_vi": "Diễn tả quan hệ tăng tiến, tương tự \"不但...而且...\" nhưng linh hoạt hơn. Cấu trúc: 不仅 + A, 还/也 + B.", "example_zh": "他不仅会说英语，还会说法语。", "example_pinyin": "Tā bùjǐn huì shuō Yīngyǔ, hái huì shuō Fǎyǔ.", "example_vi": "Anh ấy không chỉ biết nói tiếng Anh mà còn biết nói tiếng Pháp."}, {"level": "HSK4", "title_zh": "是不是 (hỏi xác nhận linh hoạt)", "title_vi": "Câu hỏi xác nhận \"是不是\"", "explanation_vi": "\"是不是\" có thể đặt ở đầu, giữa hoặc cuối câu để hỏi xác nhận về nội dung câu. Cấu trúc: S + 是不是 + Mệnh đề？", "example_zh": "你是不是不舒服？", "example_pinyin": "Nǐ shì bu shì bù shūfu?", "example_vi": "Có phải bạn không khỏe không?"}, {"level": "HSK4", "title_zh": "难道...吗？", "title_vi": "Câu hỏi tu từ \"chẳng lẽ...\"", "explanation_vi": "Câu hỏi tu từ nhấn mạnh sự ngạc nhiên hoặc phản bác. Cấu trúc: 难道 + Mệnh đề + 吗？", "example_zh": "难道你不知道吗？", "example_pinyin": "Nándào nǐ bù zhīdào ma?", "example_vi": "Chẳng lẽ bạn không biết sao?"}, {"level": "HSK4", "title_zh": "连...都/也...", "title_vi": "Ngay cả... cũng...", "explanation_vi": "Nhấn mạnh trường hợp cực đoan, \"ngay cả... cũng...\". Cấu trúc: 连 + N + 都/也 + V.", "example_zh": "连小孩子都知道这个道理。", "example_pinyin": "Lián xiǎoháizi dōu zhīdào zhège dàolǐ.", "example_vi": "Ngay cả trẻ con cũng biết đạo lý này."}, {"level": "HSK4", "title_zh": "甚至 (连...都/也...)", "title_vi": "Thậm chí", "explanation_vi": "Nhấn mạnh mức độ cao hơn, đưa ra trường hợp cực đoan hơn để tăng tính thuyết phục. Cấu trúc: ..., 甚至 + (连) + N + 都/也...", "example_zh": "他很忙，甚至连饭都没时间吃。", "example_pinyin": "Tā hěn máng, shènzhì lián fàn dōu méi shíjiān chī.", "example_vi": "Anh ấy rất bận, thậm chí không có thời gian ăn cơm."}, {"level": "HSK4", "title_zh": "居然/竟然", "title_vi": "Không ngờ, thế mà", "explanation_vi": "Phó từ diễn tả sự ngạc nhiên vì kết quả trái với dự đoán. Cấu trúc: S + 居然/竟然 + V.", "example_zh": "他居然一个人做完了。", "example_pinyin": "Tā jūrán yí ge rén zuò wán le.", "example_vi": "Anh ấy không ngờ lại tự mình làm xong một mình."}, {"level": "HSK4", "title_zh": "之所以...是因为...", "title_vi": "Sở dĩ... là vì...", "explanation_vi": "Nhấn mạnh nguyên nhân, giải thích lý do của kết quả đã nêu. Cấu trúc: 之所以 + Kết quả, 是因为 + Nguyên nhân.", "example_zh": "他之所以成功，是因为他很努力。", "example_pinyin": "Tā zhī suǒyǐ chénggōng, shì yīnwèi tā hěn nǔlì.", "example_vi": "Sở dĩ anh ấy thành công là vì anh ấy rất nỗ lực."}, {"level": "HSK4", "title_zh": "既然...就...", "title_vi": "Đã vậy... thì...", "explanation_vi": "Diễn tả suy luận dựa trên một sự thật đã biết. Cấu trúc: 既然 + Thực tế, 就 + Kết luận/đề nghị.", "example_zh": "既然你不舒服，就在家休息吧。", "example_pinyin": "Jìrán nǐ bù shūfu, jiù zài jiā xiūxi ba.", "example_vi": "Đã vậy bạn không khỏe thì cứ ở nhà nghỉ ngơi đi."}, {"level": "HSK4", "title_zh": "与其...不如...", "title_vi": "Thay vì... chi bằng...", "explanation_vi": "So sánh hai lựa chọn, cho rằng vế sau tốt hơn vế trước. Cấu trúc: 与其 + A, 不如 + B.", "example_zh": "与其在家等，不如出去找工作。", "example_pinyin": "Yǔqí zài jiā děng, bùrú chūqù zhǎo gōngzuò.", "example_vi": "Thay vì ở nhà chờ đợi, chi bằng ra ngoài tìm việc."}, {"level": "HSK4", "title_zh": "不得不", "title_vi": "Không thể không, buộc phải", "explanation_vi": "Diễn tả sự bắt buộc, không có lựa chọn khác. Cấu trúc: S + 不得不 + V.", "example_zh": "因为下雨，我们不得不取消比赛。", "example_pinyin": "Yīnwèi xiàyǔ, wǒmen bùdébù qǔxiāo bǐsài.", "example_vi": "Vì trời mưa, chúng tôi buộc phải hủy trận đấu."}, {"level": "HSK4", "title_zh": "只好", "title_vi": "Đành phải", "explanation_vi": "Diễn tả việc phải làm gì đó như một giải pháp cuối cùng, không hài lòng nhưng buộc phải chấp nhận. Cấu trúc: S + 只好 + V.", "example_zh": "没有出租车，我只好走路回家。", "example_pinyin": "Méiyǒu chūzūchē, wǒ zhǐhǎo zǒulù huíjiā.", "example_vi": "Không có taxi, tôi đành phải đi bộ về nhà."}, {"level": "HSK4", "title_zh": "万一", "title_vi": "Lỡ như, nhỡ đâu", "explanation_vi": "Diễn tả tình huống giả định xấu có thể xảy ra với xác suất thấp. Cấu trúc: 万一 + Tình huống, S + 就 + Kết quả.", "example_zh": "万一下雨，我们就不去了。", "example_pinyin": "Wànyī xiàyǔ, wǒmen jiù bú qù le.", "example_vi": "Lỡ như trời mưa thì chúng tôi sẽ không đi nữa."}, {"level": "HSK4", "title_zh": "以免" héng le \"hàn\" zì.", "example_vi": "Tôi đã viết nhầm chữ \"hán\" thành chữ \"hãn\"."}, {"level": "HSK4", "title_zh": "除了...还/也... (bổ sung)", "title_vi": "Ngoài... còn/cũng... (bổ sung thêm)", "explanation_vi": "Khác với \"除了...都...\" (loại trừ), cấu trúc này mang nghĩa bổ sung thêm ngoài cái đã nêu. Cấu trúc: 除了 + A，还/也 + B.", "example_zh": "除了英语，他还会说日语。", "example_pinyin": "Chúle Yīngyǔ, tā hái huì shuō Rìyǔ.", "example_vi": "Ngoài tiếng Anh ra, anh ấy còn biết nói tiếng Nhật."}, {"level": "HSK4", "title_zh": "趋向补语引申义 (起来/下去/出来)", "title_vi": "Nghĩa mở rộng của bổ ngữ xu hướng", "explanation_vi": "Các bổ ngữ xu hướng như 起来/下去/出来 mang nghĩa trừu tượng ngoài phương hướng vật lý, ví dụ bắt đầu, tiếp tục, nhận ra. Cấu trúc: V + 起来/下去/出来 (nghĩa mở rộng).", "example_zh": "大家突然笑了起来。", "example_pinyin": "Dàjiā tūrán xiào le qǐlái.", "example_vi": "Mọi người bỗng nhiên cười lên."}];
const LEVELS = ["HSK1","HSK2","HSK3","HSK4"];
const PAGE_SIZE = 20;

// ---------- learned-state storage (persists in browser; falls back to memory if unavailable) ----------
const store = (function(){
  let mem = {};
  let ok = false;
  try {
    const t = '__hsk_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    ok = true;
  } catch(e){ ok = false; }
  const KEY = 'hsk_portal_learned_v1';
  return {
    load(){
      if(ok){
        try { return JSON.parse(window.localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; }
      }
      return mem;
    },
    save(obj){
      if(ok){
        try { window.localStorage.setItem(KEY, JSON.stringify(obj)); } catch(e){}
      }
      mem = obj;
    },
    persistent: ok
  };
})();
let learned = store.load();

function isLearned(hanzi){ return !!learned[hanzi]; }
function toggleLearned(hanzi){
  if(learned[hanzi]) delete learned[hanzi];
  else learned[hanzi] = 1;
  store.save(learned);
}

// ---------- shared ----------
function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(arr,n){ return shuffle(arr).slice(0,n); }

// ---------- nav ----------
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['vocab','grammar','quiz'].forEach(v=>{
      document.getElementById('view-'+v).style.display = (v===btn.dataset.view)?'block':'none';
    });
  });
});

// ================= VOCAB VIEW =================
let vocabLevels = new Set(LEVELS);
let vocabQuery = '';
let vocabPage = 1;
let studyFilter = 'all'; // all | learned | unlearned

function levelChipsHTML(idPrefix, selectedSet){
  return LEVELS.map(lv=>{
    const on = selectedSet.has(lv) ? 'on' : '';
    return `<span class="level-chip ${on}" data-lv="${lv}" data-group="${idPrefix}">${lv}</span>`;
  }).join('');
}

function renderVocabChips(){
  document.getElementById('vocab-level-chips').innerHTML = levelChipsHTML('vocab', vocabLevels);
  document.querySelectorAll('.level-chip[data-group="vocab"]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const lv = chip.dataset.lv;
      if(vocabLevels.has(lv)){ vocabLevels.delete(lv); } else { vocabLevels.add(lv); }
      vocabPage = 1;
      renderVocabChips();
      renderVocabList();
    });
  });
}

document.querySelectorAll('.study-chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    studyFilter = chip.dataset.study;
    document.querySelectorAll('.study-chip').forEach(c=>c.classList.toggle('on', c===chip));
    vocabPage = 1;
    renderVocabList();
  });
});

function filteredVocab(){
  const q = vocabQuery.trim().toLowerCase();
  const raw = vocabQuery.trim();
  return VOCAB.filter(v=>{
    if(!vocabLevels.has(v.level)) return false;
    if(studyFilter==='learned' && !isLearned(v.hanzi)) return false;
    if(studyFilter==='unlearned' && isLearned(v.hanzi)) return false;
    if(!q) return true;
    return (v.hanzi && v.hanzi.includes(raw)) ||
           (v.pinyin && v.pinyin.toLowerCase().includes(q)) ||
           (v.hanviet && v.hanviet.toLowerCase().includes(q)) ||
           (v.meaning_vi && v.meaning_vi.toLowerCase().includes(q));
  });
}

function vocabCardHTML(v, idx){
  const l = isLearned(v.hanzi);
  return `<div class="vocab-card ${l?'learned':''}" data-hanzi="${v.hanzi}">
    <button class="speak-btn" onclick="speak('${(v.hanzi||'').replace(/'/g,"\\'")}')">🔊</button>
    <div class="hz">${v.hanzi||''}</div>
    <div class="body">
      <div class="row1">
        <span class="pinyin">${v.pinyin||''}</span>
        <span class="hanviet">[${v.hanviet||'—'}]</span>
        <span class="badge ${v.level}">${v.level}</span>
        <span class="pos">${v.pos||''}</span>
      </div>
      <div class="meaning">${v.meaning_vi||''}</div>
      <div class="example"><span class="zh">${v.example_zh||''}</span> <span style="color:var(--accent)">${v.example_pinyin||''}</span><br>${v.example_vi||''}</div>
    </div>
    <button class="learn-btn ${l?'on':''}" data-learn="${v.hanzi}">${l?'✓ Đã học':'Đánh dấu'}</button>
  </div>`;
}

function paginationHTML(totalPages, current){
  if(totalPages<=1) return '';
  const parts = [];
  parts.push(`<button data-page="${current-1}" ${current===1?'disabled':''}>‹</button>`);
  // condensed page list: 1 ... c-1 c c+1 ... N
  const pages = new Set([1,2,totalPages-1,totalPages,current-1,current,current+1]);
  let prev = 0;
  for(let p=1;p<=totalPages;p++){
    if(!pages.has(p)) continue;
    if(p-prev>1) parts.push('<span class="ellipsis">…</span>');
    parts.push(`<button data-page="${p}" class="${p===current?'current':''}">${p}</button>`);
    prev = p;
  }
  parts.push(`<button data-page="${current+1}" ${current===totalPages?'disabled':''}>›</button>`);
  return parts.join('');
}

function renderVocabList(){
  const list = filteredVocab();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(vocabPage > totalPages) vocabPage = totalPages;
  const start = (vocabPage-1)*PAGE_SIZE;
  const shown = list.slice(start, start+PAGE_SIZE);

  const learnedTotal = VOCAB.filter(v=>isLearned(v.hanzi)).length;
  document.getElementById('vocab-count').textContent =
    `${list.length} từ · trang ${vocabPage}/${totalPages}`;
  document.getElementById('learned-count').textContent =
    `Đã học: ${learnedTotal}/${VOCAB.length} từ` + (store.persistent ? '' : ' (lưu tạm trong phiên này)');

  document.getElementById('vocab-list').innerHTML = shown.map(vocabCardHTML).join('');
  document.getElementById('vocab-pagination').innerHTML = paginationHTML(totalPages, vocabPage);

  document.querySelectorAll('#vocab-pagination button[data-page]').forEach(b=>{
    b.addEventListener('click',()=>{
      vocabPage = parseInt(b.dataset.page);
      renderVocabList();
      document.getElementById('view-vocab').scrollIntoView({behavior:'smooth'});
    });
  });
  document.querySelectorAll('.learn-btn[data-learn]').forEach(b=>{
    b.addEventListener('click',()=>{
      toggleLearned(b.dataset.learn);
      renderVocabList();
    });
  });
}

document.getElementById('vocab-search').addEventListener('input', e=>{
  vocabQuery = e.target.value;
  vocabPage = 1;
  renderVocabList();
});

renderVocabChips();
renderVocabList();

// ================= GRAMMAR VIEW =================
let grammarLevels = new Set(LEVELS);

function renderGrammarChips(){
  document.getElementById('grammar-level-chips').innerHTML = levelChipsHTML('grammar', grammarLevels);
  document.querySelectorAll('.level-chip[data-group="grammar"]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const lv = chip.dataset.lv;
      if(grammarLevels.has(lv)){ grammarLevels.delete(lv); } else { grammarLevels.add(lv); }
      renderGrammarChips();
      renderGrammarList();
    });
  });
}

function renderGrammarList(){
  const list = GRAMMAR.filter(g=>grammarLevels.has(g.level));
  document.getElementById('grammar-count').textContent = `${list.length} cấu trúc ngữ pháp`;
  let html = '';
  let lastLevel = null;
  list.forEach(g=>{
    if(g.level !== lastLevel){
      html += `<h2 class="section">${g.level}</h2>`;
      lastLevel = g.level;
    }
    html += `<div class="grammar-card">
      <span class="badge ${g.level}">${g.level}</span>
      <h3>${g.title_zh}</h3>
      <div class="titlevi">${g.title_vi}</div>
      <div class="explain">${g.explanation_vi}</div>
      <div class="example">
        <span class="zh">${g.example_zh}</span>
        <button class="speak-btn" style="width:24px;height:24px;font-size:12px;vertical-align:middle;" onclick="speak('${(g.example_zh||'').replace(/'/g,"\\'")}')">🔊</button>
        <br><span class="py">${g.example_pinyin}</span><br><span class="vi">${g.example_vi}</span>
      </div>
    </div>`;
  });
  document.getElementById('grammar-list').innerHTML = html;
}

renderGrammarChips();
renderGrammarList();

// ================= QUIZ VIEW =================
let quizLevels = new Set(LEVELS);
let quizTypes = new Set(['meaning','fillblank','grammar']);
let quizCount = 10;
let quizOnlyUnlearned = false;
let quizQuestions = [];
let quizIndex = 0;
let quizScore = 0;
let quizAnswers = [];

function buildMeaningQuestion(pool, allPool){
  const target = pool[Math.floor(Math.random()*pool.length)];
  const distractorPool = allPool.filter(v=>v.hanzi!==target.hanzi);
  const distractors = pick(distractorPool, 3).map(v=>v.meaning_vi);
  const options = shuffle([target.meaning_vi, ...distractors]);
  return {
    type:'meaning',
    prompt: target.hanzi,
    sub: target.pinyin + ' [' + (target.hanviet||'') + ']' + (target.level? '  ·  '+target.level : ''),
    question: 'Nghĩa của từ này là gì?',
    options, correct: target.meaning_vi,
    speakText: target.hanzi
  };
}
function buildFillBlankQuestion(pool, allPool){
  const candidates = pool.filter(v=>v.example_zh && v.hanzi && v.example_zh.includes(v.hanzi));
  const src = candidates.length ? candidates : pool;
  const target = src[Math.floor(Math.random()*src.length)];
  let blanked = target.example_zh;
  if(target.hanzi && blanked.includes(target.hanzi)){
    blanked = blanked.replace(target.hanzi, '____');
  } else {
    blanked = '____ ' + blanked;
  }
  const distractorPool = allPool.filter(v=>v.hanzi!==target.hanzi && v.pos===target.pos);
  const fallback = allPool.filter(v=>v.hanzi!==target.hanzi);
  const distractors = pick(distractorPool.length>=3?distractorPool:fallback, 3).map(v=>v.hanzi);
  const options = shuffle([target.hanzi, ...distractors]);
  return {
    type:'fillblank',
    prompt: blanked,
    sub: target.example_vi || '',
    question: 'Điền từ còn thiếu vào chỗ trống:',
    options, correct: target.hanzi,
    speakText: target.example_zh
  };
}
function buildGrammarQuestion(pool){
  const target = pool[Math.floor(Math.random()*pool.length)];
  const distractorPool = pool.filter(g=>g.title_zh!==target.title_zh);
  const distractors = pick(distractorPool, 3).map(g=>g.title_vi + ' ('+g.title_zh+')');
  const options = shuffle([target.title_vi+' ('+target.title_zh+')', ...distractors]);
  return {
    type:'grammar',
    prompt: target.example_zh,
    sub: target.example_vi,
    question: 'Câu này minh họa cấu trúc ngữ pháp nào?',
    options, correct: target.title_vi+' ('+target.title_zh+')',
    speakText: target.example_zh
  };
}

function renderQuizSetup(){
  const html = `
    <div class="quiz-setup">
      <div class="row">
        <label class="title">Cấp độ muốn luyện</label>
        <div id="quiz-level-chips"></div>
      </div>
      <div class="row">
        <label class="title">Dạng bài tập</label>
        <span class="type-chip ${quizTypes.has('meaning')?'on':''}" data-type="meaning">Từ vựng → Nghĩa</span>
        <span class="type-chip ${quizTypes.has('fillblank')?'on':''}" data-type="fillblank">Điền từ vào câu</span>
        <span class="type-chip ${quizTypes.has('grammar')?'on':''}" data-type="grammar">Nhận diện ngữ pháp</span>
      </div>
      <div class="row">
        <label class="title">Phạm vi từ vựng</label>
        <span class="type-chip ${!quizOnlyUnlearned?'on':''}" data-scope="all">Tất cả từ</span>
        <span class="type-chip ${quizOnlyUnlearned?'on':''}" data-scope="unlearned">Chỉ từ chưa học</span>
      </div>
      <div class="row">
        <label class="title">Số câu hỏi</label>
        <div class="num-choice">
          ${[10,20,30].map(n=>`<button data-n="${n}" class="${quizCount===n?'on':''}">${n} câu</button>`).join('')}
        </div>
      </div>
      <button class="primary-btn" id="quiz-start">Bắt đầu luyện tập</button>
    </div>`;
  document.getElementById('quiz-container').innerHTML = html;

  document.getElementById('quiz-level-chips').innerHTML = levelChipsHTML('quiz', quizLevels);
  document.querySelectorAll('.level-chip[data-group="quiz"]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const lv = chip.dataset.lv;
      if(quizLevels.has(lv)){ if(quizLevels.size>1) quizLevels.delete(lv); } else { quizLevels.add(lv); }
      renderQuizSetup();
    });
  });
  document.querySelectorAll('.type-chip[data-type]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const t = chip.dataset.type;
      if(quizTypes.has(t)){ if(quizTypes.size>1) quizTypes.delete(t); } else { quizTypes.add(t); }
      renderQuizSetup();
    });
  });
  document.querySelectorAll('.type-chip[data-scope]').forEach(chip=>{
    chip.addEventListener('click',()=>{
      quizOnlyUnlearned = chip.dataset.scope === 'unlearned';
      renderQuizSetup();
    });
  });
  document.querySelectorAll('.num-choice button').forEach(b=>{
    b.addEventListener('click',()=>{ quizCount = parseInt(b.dataset.n); renderQuizSetup(); });
  });
  document.getElementById('quiz-start').addEventListener('click', startQuiz);
}

function startQuiz(){
  const allPool = VOCAB.filter(v=>quizLevels.has(v.level));
  let vpool = allPool;
  if(quizOnlyUnlearned){
    vpool = allPool.filter(v=>!isLearned(v.hanzi));
    if(vpool.length < 4){
      alert('Số từ chưa học ở cấp độ đã chọn quá ít (dưới 4 từ). Hãy chọn "Tất cả từ" hoặc thêm cấp độ.');
      return;
    }
  }
  const gpool = GRAMMAR.filter(g=>quizLevels.has(g.level));
  const types = Array.from(quizTypes).filter(t=> t!=='grammar' || gpool.length>=4 );
  if(vpool.length < 4 && (types.includes('meaning')||types.includes('fillblank'))){
    alert('Không đủ dữ liệu cho cấp độ đã chọn, hãy chọn thêm cấp độ.');
    return;
  }
  quizQuestions = [];
  for(let i=0;i<quizCount;i++){
    const t = types[Math.floor(Math.random()*types.length)];
    if(t==='meaning') quizQuestions.push(buildMeaningQuestion(vpool, allPool));
    else if(t==='fillblank') quizQuestions.push(buildFillBlankQuestion(vpool, allPool));
    else quizQuestions.push(buildGrammarQuestion(gpool));
  }
  quizIndex = 0; quizScore = 0; quizAnswers = [];
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const q = quizQuestions[quizIndex];
  const pct = Math.round((quizIndex)/quizQuestions.length*100);
  let html = `
    <div class="quiz-progress"><span>Câu ${quizIndex+1}/${quizQuestions.length}</span><span>Điểm: ${quizScore}</span></div>
    <div class="progress-bar"><div style="width:${pct}%"></div></div>
    <div class="quiz-question">${q.question}</div>
    <div class="quiz-prompt">${q.prompt} ${q.speakText? `<button class="speak-btn" onclick="speak('${q.speakText.replace(/'/g,"\\'")}')">🔊</button>`:''}</div>
    <div class="quiz-sub">${q.sub||''}</div>
    <div class="quiz-options">
      ${q.options.map((opt,i)=>`<button class="opt-btn" data-opt="${i}">${opt}</button>`).join('')}
    </div>
    <div class="quiz-footer"><button class="primary-btn" id="quiz-next" disabled>Câu tiếp theo</button></div>
  `;
  document.getElementById('quiz-container').innerHTML = html;
  document.querySelectorAll('.opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const chosen = btn.textContent;
      const isCorrect = chosen === q.correct;
      document.querySelectorAll('.opt-btn').forEach(b=>{
        b.disabled = true;
        if(b.textContent === q.correct) b.classList.add('correct');
        else if(b===btn) b.classList.add('wrong');
      });
      if(isCorrect) quizScore++;
      quizAnswers.push({question:q, chosen, isCorrect});
      document.getElementById('quiz-next').disabled = false;
    });
  });
  document.getElementById('quiz-next').addEventListener('click', ()=>{
    quizIndex++;
    if(quizIndex < quizQuestions.length) renderQuizQuestion();
    else renderQuizResult();
  });
}

function renderQuizResult(){
  const pct = Math.round(quizScore/quizQuestions.length*100);
  let html = `
    <div class="score-summary">
      <div>Kết quả</div>
      <div class="big">${quizScore}/${quizQuestions.length}</div>
      <div>${pct}% chính xác</div>
      <button class="primary-btn" id="quiz-retry" style="margin-top:14px;">Luyện tập lại</button>
    </div>
    <h2 class="section">Xem lại</h2>
  `;
  quizAnswers.forEach(a=>{
    html += `<div class="review-item ${a.isCorrect?'ok':'wrong'}">
      <div><strong>${a.question.prompt}</strong> — ${a.question.sub||''}</div>
      <div>Bạn chọn: ${a.chosen} ${a.isCorrect?'✔️':'❌'}</div>
      ${!a.isCorrect ? `<div>Đáp án đúng: <strong>${a.question.correct}</strong></div>` : ''}
    </div>`;
  });
  document.getElementById('quiz-container').innerHTML = html;
  document.getElementById('quiz-retry').addEventListener('click', renderQuizSetup);
}

renderQuizSetup();
</script>
